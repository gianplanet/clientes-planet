    $('planet-enviadas-list').innerHTML = '<div class="empty-state"><p>No hay consultas enviadas</p></div>';
    return;
  }
  $('planet-enviadas-list').innerHTML = renderPlanetGrupos(consultas, true);
}

// Lista agrupada: Pendientes → En proceso → Esperando info → Cerradas
function renderPlanetGrupos(consultas, isPlanetQuery) {
  const titulos = {
    pendiente: 'Pendientes — requieren atención',
    proceso: 'En proceso',
    espera: isPlanetQuery ? 'Esperando respuesta del cliente' : 'Esperando info del cliente',
    cerrado: 'Cerradas'
  };
  let html = '';
  ['pendiente','proceso','espera','cerrado'].forEach(g => {
    const list = consultas.filter(c => grupoPlanet(c.estado) === g);
    if (list.length === 0) return;
    const color = g === 'pendiente' ? 'var(--danger)' : g === 'cerrado' ? '' : GRUPOS[g].color;
    html += `<div class="section-label" style="${html ? 'margin-top:20px;' : ''}${color ? 'color:' + color : ''}">${titulos[g]}</div>`;
    list.forEach(c => html += renderTicketCard(c, isPlanetQuery));
  });
  return html;
}

function renderTicketCard(c, isPlanetQuery) {
  const msgs = c.mensajes || [];
  const grupo = grupoPlanet(c.estado);
  const stripeClass = GRUPOS[grupo].stripe;
  const dirTag = c.direccion === 'cliente_a_planet'
    ? '<span class="ticket-direction-tag dir-incoming">← Recibida</span>'
    : '<span class="ticket-direction-tag dir-outgoing">→ Enviada</span>';

  // Thread — always show history, reply bar only if not closed
  let threadHtml = '';
  if (msgs.length > 0) {
    threadHtml += '<div class="ticket-thread">';
    msgs.forEach(m => {
      const col = avatarColor(m.nombre || m.autor);
      threadHtml += `
        <div class="thread-msg">
          <div class="thread-avatar" style="background:${col}">${esc((m.nombre||m.autor)[0])}</div>
          <div class="thread-content">
            <div class="thread-meta">
              <span class="thread-name">${esc(m.nombre||m.autor)}</span>
              <span class="thread-time">${esc(fmtFecha(m.fecha))}</span>
            </div>
            ${m.texto ? `<div class="thread-text">${esc(m.texto)}</div>` : ''}
            ${imagenesMsgHtml(m.imagenes)}
          </div>
        </div>`;
    });
    // Reply bar only if not closed
    if (grupo !== 'cerrado') {
      threadHtml += `
        <div class="img-previews thread-previews" id="prev-p${c.id}">${previasHtml('p' + c.id)}</div>
        <div class="thread-reply-bar">
          <button type="button" class="attach-btn" onclick="elegirImagenes('p${c.id}')" title="Adjuntar fotos">${CLIP_ICON}</button>
          <input class="thread-reply-input" placeholder="Responder... (podés pegar fotos con Ctrl+V)" id="preply-${c.id}" onkeydown="if(event.key==='Enter')planetReply(${c.id}, false, this.nextElementSibling)">
          <button class="thread-reply-btn" onclick="planetReply(${c.id}, false, this)" title="Envía el mensaje; la consulta queda En proceso">Enviar</button>
          <button class="thread-reply-btn btn-wait" onclick="planetReply(${c.id}, true, this)" title="Envía el mensaje y pasa la consulta a Esperando info">Enviar y pedir info</button>
        </div>`;
    }
    threadHtml += '</div>';
  }

  // Action buttons
  let actionsHtml = '';
  if (grupo === 'pendiente') {
    actionsHtml = `
      <div class="status-actions">
        <button class="status-btn btn-proceso" onclick="changeStatus(${c.id},'En proceso',this)">Tomar → En proceso</button>
        <button class="status-btn btn-cerrar" onclick="changeStatus(${c.id},'Cerrado',this)">Cerrar</button>
      </div>`;
  } else if (grupo === 'proceso') {
    actionsHtml = `
      <div class="status-actions">
        <button class="status-btn btn-cerrar" onclick="changeStatus(${c.id},'Cerrado',this)">Cerrar</button>
      </div>`;
  } else if (grupo === 'espera') {
    actionsHtml = `
      <div class="status-actions">
        <button class="status-btn btn-proceso" onclick="changeStatus(${c.id},'En proceso',this)">Retomar → En proceso</button>
        <button class="status-btn btn-cerrar" onclick="changeStatus(${c.id},'Cerrado',this)">Cerrar</button>
      </div>`;
  }

  const cardId = 'tcard-' + c.id;
  return `
    <div class="ticket-card${openClass(cardId)}" id="${cardId}">
      <div class="ticket-stripe ${stripeClass}"></div>
      <div class="ticket-body">
        <div class="card-summary" onclick="toggleCard('${cardId}')">
          <div class="card-top">
            ${badgeEstado(grupo, false)}
            <span class="card-date">${esc(fmtFecha(c.fecha))}</span>
            ${c.estado === 'Respuesta cliente' ? '<span class="tag-respondio">💬 Respondió el cliente</span>' : ''}
            <span class="ticket-client-tag tag-${esc(c.cliente)}">${esc(c.cliente)}</span>
            ${CHEVRON}
          </div>
          <div class="card-asunto">${esc(c.asunto)}</div>
        </div>
        <div class="ticket-details">
          <div class="ticket-footer" style="margin-bottom:6px;">
            <span class="ticket-tracking">#${c.id}</span>
            ${dirTag}
            <span class="ticket-who">${c.creado_por ? 'Crea: ' + esc(c.nombre_creador) : ''}${c.atendido_por ? ' · Atiende: ' + esc(c.atendido_por) : ''}</span>
          </div>
          ${threadHtml}
          ${actionsHtml}
        </div>
      </div>
    </div>`;
}

async function planetReply(id, pedirInfo, btn) {
  const input = $('preply-' + id);
  const texto = input.value.trim();
  const clave = 'p' + id;
  if (input.disabled) return;
  if (!texto && !hayImagenes(clave)) { toast(pedirInfo ? 'Escribí qué info necesitás del cliente' : 'Escribí un mensaje'); sacudir(input); input.focus(); return; }
  const cardId = 'tcard-' + id;
  input.disabled = true;
  const listo = ocupado(btn, 'Enviando...');
  tarjetaOcupada(cardId, true);

  let imagenes = [];
  if (hayImagenes(clave)) {
    imagenes = await subirImagenes(clave, btn);
    if (!imagenes) { tarjetaOcupada(cardId, false); listo(); input.disabled = false; return; }
    if (btn) btn.textContent = 'Enviando...';
  }
  const params = { action: 'responder', id: id, texto: texto };
  if (imagenes.length) params.imagenes = JSON.stringify(imagenes);
  if (pedirInfo) params.esperar_info = '1';
  const res = await api(params);

  tarjetaOcupada(cardId, false);
  listo();
  input.disabled = false;

  if (res.ok) {
    input.value = '';
    toast(pedirInfo ? '✓ Mensaje enviado · Esperando info del cliente' : '✓ Mensaje enviado');
    // Mismo cambio que hace el servidor
    const c = allConsultas.find(x => String(x.id) === String(id));
    let estado = null;
    if (pedirInfo) estado = 'Esperando info';
    else if (c && (c.estado === 'Abierto' || c.estado === 'Respuesta cliente')) estado = 'En proceso';
    delete imgsPendientes[clave];
    aplicarLocal(allConsultas, id, estado ? { estado, atendido_por: currentUser.nombre } : {},
      { autor: currentUser.usuario, nombre: currentUser.nombre, fecha: ahoraTexto(), texto, imagenes });
    renderPlanetData(allConsultas);
    loadPlanetData();
  } else {
    toast('Error: ' + (res.error || 'No se pudo enviar') + ' — tocá ↻ antes de reenviar');
  }
}

async function changeStatus(id, estado, btn) {
  const cardId = 'tcard-' + id;
  const listo = ocupado(btn, estado === 'Cerrado' ? 'Cerrando...' : 'Guardando...');
  tarjetaOcupada(cardId, true);

  const res = await api({ action: 'cambiar_estado', id: id, estado: estado, atendido_por: currentUser.nombre });

  tarjetaOcupada(cardId, false);
  listo();
  if (res.ok) {
    toast('✓ Estado cambiado a ' + estadoLabel(estado));
    aplicarLocal(allConsultas, id, { estado, atendido_por: currentUser.nombre });
    renderPlanetData(allConsultas);
    loadPlanetData();
  } else {
    toast('Error: ' + (res.error || 'No se pudo cambiar'));
  }
}

async function sendPlanetNewQuery() {
  const cliente = $('pnq-cliente').value;
  const tracking = $('pnq-tracking').value.trim();
  const venta = $('pnq-venta').value.trim();
  const tipo = $('pnq-tipo').value;
  const mensaje = $('pnq-mensaje').value.trim();
  if (!tracking || !tipo || !mensaje || !cliente) {
    toast('Completá tracking, tipo de problema y mensaje');
    sacudirVacios(['pnq-cliente', 'pnq-tracking', 'pnq-tipo', 'pnq-mensaje']);
    return;
  }
  const asunto = buildAsunto(tracking, venta, cliente, tipo);

  if ($('pnq-send').disabled) return;
  const listoPnq = ocupado($('pnq-send'), 'Enviando...');
  toast.cargando(hayImagenes('pnq') ? 'Subiendo fotos…' : 'Enviando consulta…');

  let imagenesPnq = [];
  if (hayImagenes('pnq')) {
    imagenesPnq = await subirImagenes('pnq', $('pnq-send'));
    if (!imagenesPnq) { listoPnq(); return; }
  }

  const res = await api({
    imagenes: JSON.stringify(imagenesPnq),
    action: 'nueva_consulta',
    asunto: asunto,
    cliente: cliente,
    direccion: 'planet_a_cliente',
    creado_por: currentUser.usuario,
    nombre_creador: currentUser.nombre,
    mensaje: mensaje
  });

  listoPnq();

  if (res.ok) {
    $('pnq-tracking').value = '';
    $('pnq-venta').value = '';
    $('pnq-tipo').value = '';
    $('pnq-mensaje').value = '';
    delete imgsPendientes['pnq'];
    pintarPrevias('pnq');
    toast('✓ Consulta #' + res.id + ' enviada', { desc: cliente + ' la va a ver en su portal.' });
    planetNav(document.querySelector('.sidebar-item'), 'planet-enviadas');
    loadPlanetData();
  } else {
    toast('Error: ' + (res.error || 'No se pudo enviar'));
  }
}

function planetNav(btn, id) {
  const yaEstaba = $(id).classList.contains('active');
  document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  moverIndicador(btn.closest('.sidebar'), btn, true);
  document.querySelectorAll('#screen-planet .planet-sub').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  if (!yaEstaba) anim($(id), { opacity: [0, 1], transform: ['translateY(8px)', 'none'] }, { duracion: 320, mantener: false });
  if (id === 'planet-usuarios') { loadUsers(); preloadClients(); }
  if (id === 'planet-clientes') loadClients();
}

async function saveUserEdit(usuario) {
  const params = { action: 'editar_usuario', usuario };
  const nombre = $('eu-nombre').value.trim();
  const team = $('eu-team').value;
  const cliente = team === 'cliente' ? $('eu-cliente').value : '-';
  const role = $('eu-role').value;
  const pass = $('eu-pass').value.trim();
  if (nombre) params.nombre = nombre;
  params.team = team;
  params.cliente = cliente;
  params.role = role;
  if (pass) params.password = pass;
  const res = await api(params);
  if (res.ok) {
    toast('Usuario actualizado');
    editingUser = null;
    loadUsers();
  } else {
    toast('Error: ' + (res.error || 'No se pudo actualizar'));
  }
}

async function deleteUser(usuario, nombre) {
  if (usuario === currentUser.usuario) { toast('No podés eliminar tu propio usuario'); return; }
  if (!confirm('¿Eliminar el usuario "' + nombre + '" (' + usuario + ')? Esta acción no se puede deshacer.')) return;
  const res = await api({ action: 'eliminar_usuario', usuario });
  if (res.ok) {
    toast('Usuario eliminado');
    loadUsers();
  } else {
    toast('Error: ' + (res.error || 'No se pudo eliminar'));
  }
}

async function createUser() {
  const usuario = $('nu-user').value.trim();
  const nombre = $('nu-name').value.trim();
  const password = $('nu-pass').value.trim();
  const team = $('nu-team').value;
  const empresa = team === 'cliente' ? $('nu-empresa').value : '-';

  if (!usuario || !nombre || !password) { toast('Completá usuario, nombre y contraseña'); return; }
  if (team === 'cliente' && !empresa) { toast('Ingresá el nombre de la empresa'); return; }

  const res = await api({
    action: 'crear_usuario',
    usuario, password, nombre, team, cliente: empresa, role
  });

  if (res.ok) {
    toast('Usuario creado');

    $('nu-name').value = '';
    $('nu-pass').value = '';
    $('nu-empresa').value = '';

    loadUsers();
  } else {
    toast('Error: ' + (res.error || 'No se pudo crear'));

        <div><span style="color:var(--text-muted);">Email:</span> ${esc(c.email || '-')}</div>
        <div><span style="color:var(--text-muted);">Dirección:</span> ${esc(c.direccion || '-')}</div>
      </div>
      ${c.notas ? `<div style="font-size:13px;color:var(--text-secondary);margin-top:8px;padding-top:8px;border-top:1px solid var(--card-border);">${esc(c.notas)}</div>` : ''}
    </div>`;
  });
  html += '</div>';
  $('clients-list').innerHTML = html;
  // Also populate the user form empresa dropdown
  populateEmpresaDropdown();
}

function populateEmpresaDropdown() {
  const sel = $('nu-empresa');
  if (!sel) return;
  let opts = '<option value="">-- Seleccionar --</option>';
  allClientesData.forEach(c => {
    opts += `<option value="${esc(c.nombre)}">${esc(c.nombre)}</option>`;
  });
  sel.innerHTML = opts;
}

async function createClient() {
  const nombre = $('nc-nombre').value.trim();
  if (!nombre) { toast('Ingresá el nombre de la empresa'); return; }
  const res = await api({
    action: 'crear_cliente',
    nombre,
    contacto: $('nc-contacto').value.trim(),
    telefono: $('nc-telefono').value.trim(),
    email: $('nc-email').value.trim(),
    direccion: $('nc-direccion').value.trim(),
    notas: $('nc-notas').value.trim()
  });
  if (res.ok) {
    toast('Cliente creado');
    ['nc-nombre','nc-contacto','nc-telefono','nc-email','nc-direccion','nc-notas'].forEach(id => $(id).value = '');
    toggleNewClientForm();
    loadClients();
  } else {
    toast('Error: ' + (res.error || 'No se pudo crear'));
  }
}

async function deleteClient(id, nombre) {
  if (!confirm('¿Eliminar el cliente "' + nombre + '"? Esta acción no se puede deshacer.')) return;
  const res = await api({ action: 'eliminar_cliente', id });
  if (res.ok) {
    toast('Cliente eliminado');
    loadClients();
  } else {
    toast('Error: ' + (res.error || 'No se pudo eliminar'));
  }
}

// Load clients on init for empresa dropdown
async function preloadClients() {
  try {
    const res = await api({ action: 'clientes' });
    if (res.ok) { allClientesData = res.clientes || []; populateEmpresaDropdown(); }
  } catch(e) {}
}

// ── INIT ──
tryAutoLogin();
</script>

</body>
