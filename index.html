<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planet · Portal de Clientes</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap">
<style>
:root {
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --primary-light: #dbeafe;
  --surface: #f1f5f9;
  --card: #ffffff;
  --card-border: #e2e8f0;
  --text: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
  --input-bg: #f8fafc;
  --input-border: #cbd5e1;
  --success: #059669;
  --success-bg: #ecfdf5;
  --success-text: #065f46;
  --warning: #d97706;
  --warning-bg: #fffbeb;
  --warning-text: #92400e;
  --danger: #dc2626;
  --danger-bg: #fef2f2;
  --danger-text: #991b1b;
  --info: #2563eb;
  --info-bg: #eff6ff;
  --info-text: #1e40af;
  --closed: #64748b;
  --closed-bg: #f1f5f9;
  --closed-text: #475569;
  --purple: #7c3aed;
  --purple-bg: #f5f3ff;
  --purple-text: #5b21b6;
  --wait: #0891b2;
  --wait-bg: #ecfeff;
  --wait-text: #155e75;
  --tab-bar-bg: #ffffff;
  --toast-bg: #0f172a; --toast-desc: #cbd5e1;
  --skel: #e2e8f0; --skel-hi: #f8fafc;
  --n-amarillo: #fef08a; --n-rosa: #fbcfe8; --n-verde: #bbf7d0; --n-celeste: #bae6fd; --n-violeta: #ddd6fe; --nota-text: #1f2937;
  --tab-bar-border: #e2e8f0;
  --overlay: rgba(15, 23, 42, 0.5);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
  --radius: 10px;
  --radius-sm: 6px;
  --font: 'DM Sans', system-ui, -apple-system, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --primary: #3b82f6; --primary-hover: #2563eb; --primary-light: #1e3a5f;
    --surface: #0f1218; --card: #1a1f2b; --card-border: #2a3040;
    --text: #e8ecf1; --text-secondary: #94a3b8; --text-muted: #64748b;
    --input-bg: #1e2433; --input-border: #334155;
    --success: #34d399; --success-bg: #064e3b; --success-text: #a7f3d0;
    --warning: #fbbf24; --warning-bg: #78350f; --warning-text: #fde68a;
    --danger: #f87171; --danger-bg: #7f1d1d; --danger-text: #fecaca;
    --info: #60a5fa; --info-bg: #1e3a5f; --info-text: #bfdbfe;
    --closed: #94a3b8; --closed-bg: #1e2433; --closed-text: #94a3b8;
    --purple: #a78bfa; --purple-bg: #2e1065; --purple-text: #c4b5fd;
    --wait: #22d3ee; --wait-bg: #164e63; --wait-text: #a5f3fc;
    --tab-bar-bg: #151a24; --tab-bar-border: #2a3040;
    --toast-bg: #2a3346; --toast-desc: #a9b6c8;
    --skel: #242b3a; --skel-hi: #2f3748;
    --n-amarillo: #5c4d12; --n-rosa: #5b2340; --n-verde: #1d4a31; --n-celeste: #16425c; --n-violeta: #3b2d66; --nota-text: #f1f5f9;
    --overlay: rgba(0, 0, 0, 0.6);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
    --shadow-lg: 0 8px 30px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"] {
  --primary: #3b82f6; --primary-hover: #2563eb; --primary-light: #1e3a5f;
  --surface: #0f1218; --card: #1a1f2b; --card-border: #2a3040;
  --text: #e8ecf1; --text-secondary: #94a3b8; --text-muted: #64748b;
  --input-bg: #1e2433; --input-border: #334155;
  --success: #34d399; --success-bg: #064e3b; --success-text: #a7f3d0;
  --warning: #fbbf24; --warning-bg: #78350f; --warning-text: #fde68a;
  --danger: #f87171; --danger-bg: #7f1d1d; --danger-text: #fecaca;
  --info: #60a5fa; --info-bg: #1e3a5f; --info-text: #bfdbfe;
  --closed: #94a3b8; --closed-bg: #1e2433; --closed-text: #94a3b8;
  --purple: #a78bfa; --purple-bg: #2e1065; --purple-text: #c4b5fd;
  --wait: #22d3ee; --wait-bg: #164e63; --wait-text: #a5f3fc;
  --tab-bar-bg: #151a24; --tab-bar-border: #2a3040;
  --toast-bg: #2a3346; --toast-desc: #a9b6c8;
  --skel: #242b3a; --skel-hi: #2f3748;
  --n-amarillo: #5c4d12; --n-rosa: #5b2340; --n-verde: #1d4a31; --n-celeste: #16425c; --n-violeta: #3b2d66; --nota-text: #f1f5f9;
  --overlay: rgba(0,0,0,0.6);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.4);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--surface);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── SCREENS ── */
.screen { display: none; }
.screen.active { display: block; }

/* ── LOGIN ── */
.login-wrap {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; padding: 40px 16px; max-width: 420px; margin: 0 auto;
}
.login-logo {
  width: 120px; height: 120px; object-fit: contain; margin-bottom: 14px;
  background: #fff; border-radius: 28px; padding: 10px; box-shadow: var(--shadow-sm);
}
.brand-logo {
  width: 40px; height: 40px; object-fit: contain; flex-shrink: 0;
  background: #fff; border-radius: 10px; padding: 3px; border: 1px solid var(--card-border);
}
.login-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.login-subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 32px; }
.login-form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 14px; }
.login-error {
  font-size: 13px; color: var(--danger); text-align: center;
  padding: 8px; background: var(--danger-bg); border-radius: var(--radius-sm);
  display: none;
}

.field label {
  display: block; font-size: 13px; font-weight: 500;
  color: var(--text-secondary); margin-bottom: 5px;
}
.field input, .field select, .field textarea {
  width: 100%; padding: 11px 14px;
  border: 1.5px solid var(--input-border);
  border-radius: var(--radius-sm);
  background: var(--input-bg);
  font-family: var(--font); font-size: 15px; color: var(--text);
  outline: none; transition: border-color 0.15s;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary); }
.field textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
.field-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.btn-primary {
  width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none;
  border-radius: var(--radius-sm); font-family: var(--font); font-size: 15px;
  font-weight: 600; cursor: pointer; transition: background 0.15s; margin-top: 6px;
}
.btn-primary:hover { background: var(--primary-hover); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

/* ── TOP BAR ── */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-bottom: 1px solid var(--card-border);
}
.topbar-left { display: flex; align-items: center; gap: 10px; }
.topbar-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 13px; font-weight: 700; color: #fff;
}
.topbar-info h2 { font-size: 15px; font-weight: 600; line-height: 1.2; }
.topbar-info span { font-size: 12px; color: var(--text-muted); }
.topbar-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1.5px solid var(--card-border); background: var(--card);
  display: grid; place-items: center; cursor: pointer;
  color: var(--text-secondary); transition: all 0.15s;
  font-family: var(--font);
}
.icon-btn:hover { border-color: var(--primary); color: var(--primary); }

/* ── ALERT BANNER ── */
.alert-banner {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: var(--radius-sm);
  margin-bottom: 16px; font-size: 13px; font-weight: 500;
}
.alert-banner.alert-danger { background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger); }
.alert-banner.alert-warning { background: var(--warning-bg); color: var(--warning-text); border: 1px solid var(--warning); }
.alert-banner.alert-info { background: var(--purple-bg); color: var(--purple-text); border: 1px solid var(--purple); }
.alert-banner svg { width: 18px; height: 18px; flex-shrink: 0; }
.alert-banner strong { font-weight: 700; }

/* ── STATS ROW ── */
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 10px; margin-bottom: 18px; }
.stat-card {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: var(--radius-sm); padding: 12px; text-align: center;
}
.stat-number { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.stat-label {
  font-size: 11px; color: var(--text-muted); margin-top: 4px;
  text-transform: uppercase; letter-spacing: 0.03em; font-weight: 500;
}

/* ── CLIENT FILTER (chips) ── */
.client-filter {
  display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;
  overflow-x: auto; padding-bottom: 4px;
}
.client-filter::-webkit-scrollbar { display: none; }
.client-chip {
  flex-shrink: 0; padding: 7px 14px; border-radius: 20px;
  font-size: 13px; font-weight: 500;
  border: 1.5px solid var(--card-border);
  background: var(--card); color: var(--text-secondary);
  cursor: pointer; transition: all 0.15s;
  white-space: nowrap; font-family: var(--font);
}
.client-chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.client-chip:hover:not(.active) { border-color: var(--primary); color: var(--primary); }

/* ── CONVERSACIÓN CON SU PROPIA BARRA ──
   Las conversaciones largas no estiran la tarjeta: se recorren con la barrita lateral. */
.msgs-scroll {
  max-height: 340px; overflow-y: auto; overscroll-behavior: contain;
  padding-right: 6px; scrollbar-width: thin;
  scrollbar-color: var(--card-border) transparent;
}
.msgs-scroll::-webkit-scrollbar { width: 8px; }
.msgs-scroll::-webkit-scrollbar-track { background: transparent; }
.msgs-scroll::-webkit-scrollbar-thumb {
  background: var(--card-border); border-radius: 8px; border: 2px solid transparent; background-clip: content-box;
}
.msgs-scroll::-webkit-scrollbar-thumb:hover { background: var(--text-muted); background-clip: content-box; }
/* Avisa que hay más mensajes arriba o abajo */
.msgs-scroll.hay-mas { border-bottom: 1px dashed var(--card-border); }
@media (max-width: 760px) { .msgs-scroll { max-height: 55vh; } }

/* ── MÉTRICAS ── */
.met-controles { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
.met-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 22px; }
.met-tile {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: var(--radius); padding: 14px 16px;
}
.met-tile .met-label {
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--text-muted);
}
.met-tile .met-valor {
  font-size: 26px; font-weight: 700; line-height: 1.15; margin-top: 6px;
  font-variant-numeric: tabular-nums; color: var(--text);
}
.met-tile .met-pie { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.met-tile .met-pie.alerta { color: var(--danger); font-weight: 600; }

.met-panel {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: var(--radius); padding: 16px 18px; margin-bottom: 18px;
}
.met-panel h4 { font-size: 14px; font-weight: 700; margin-bottom: 14px; }

/* Barras de tipos de consulta: una sola serie, un solo color */
.barra-fila { display: grid; grid-template-columns: minmax(120px, 34%) 1fr auto; gap: 12px; align-items: center; margin-bottom: 10px; }
.barra-nombre { font-size: 13px; color: var(--text-secondary); overflow-wrap: anywhere; }
.barra-pista { background: var(--surface); border-radius: 4px; height: 14px; overflow: hidden; }
.barra-valor-fill { height: 14px; background: var(--primary); border-radius: 0 4px 4px 0; min-width: 3px; }
.barra-cifra { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); white-space: nowrap; }
.barra-cifra span { font-weight: 400; color: var(--text-muted); }

.met-tabla { width: 100%; border-collapse: collapse; font-size: 13px; }
.met-tabla th {
  text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--text-muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--card-border);
}
.met-tabla td { padding: 8px; border-bottom: 1px solid var(--card-border); color: var(--text-secondary); }
.met-tabla td:first-child { color: var(--text); font-weight: 600; }
.met-tabla td.num { text-align: right; font-variant-numeric: tabular-nums; }
.met-nota { font-size: 12px; color: var(--text-muted); line-height: 1.5; margin-top: 6px; }

/* ── BUSCADOR ── */
.search-row { position: relative; margin-bottom: 12px; }
.search-row .search-ico {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; color: var(--text-muted); pointer-events: none;
}
.search-input {
  width: 100%; padding: 10px 36px 10px 36px;
  border: 1.5px solid var(--input-border); border-radius: 20px;
  background: var(--input-bg); font-family: var(--font); font-size: 14px;
  color: var(--text); outline: none; transition: border-color 0.15s;
}
.search-input:focus { border-color: var(--primary); }
.search-clear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; border-radius: 50%; border: none; padding: 0;
  background: var(--surface); color: var(--text-muted); cursor: pointer; display: none;
}
.search-row.con-texto .search-clear { display: grid; place-items: center; }
.search-info { font-size: 12px; color: var(--text-muted); margin: -4px 0 10px; }

/* Botón "Ver más" al final de las listas largas */
.ver-mas {
  display: block; width: 100%; margin: 14px 0 4px; padding: 11px;
  border: 1.5px dashed var(--card-border); border-radius: var(--radius);
  background: var(--card); color: var(--text-secondary);
  font-family: var(--font); font-size: 14px; font-weight: 600; cursor: pointer;
  transition: all 0.15s;
}
.ver-mas:hover { border-color: var(--primary); color: var(--primary); }
.ver-mas span { font-weight: 400; color: var(--text-muted); }

/* Selector de cliente (cuando son muchos para botones) */
.cliente-select {
  width: 100%; max-width: 320px; margin-bottom: 16px; padding: 9px 12px;
  border: 1.5px solid var(--input-border); border-radius: 20px;
  background: var(--input-bg); color: var(--text);
  font-family: var(--font); font-size: 14px; cursor: pointer;
}

.section-label {
  font-size: 12px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 10px;
}

/* ── CARD SUMMARY (collapsed row, shared) ── */
.card-summary { cursor: pointer; }
.card-top { user-select: none; }
.card-asunto, .ticket-tracking, .thread-text, .timeline-item { user-select: text; }
.copy-btn {
  flex-shrink: 0; width: 26px; height: 26px; border-radius: 6px; padding: 0;
  border: 1px solid var(--card-border); background: var(--card); color: var(--text-muted);
  display: grid; place-items: center; cursor: pointer; transition: all 0.15s;
}
.copy-btn:hover { border-color: var(--primary); color: var(--primary); }
.copy-btn svg { width: 14px; height: 14px; }
.card-top { display: flex; align-items: center; gap: 8px; }
.card-date { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.card-chevron {
  margin-left: auto; width: 18px; height: 18px; flex-shrink: 0;
  color: var(--text-muted); transition: transform 0.5s var(--ease-spring);
}
.open > .card-summary .card-chevron,
.open .ticket-body > .card-summary .card-chevron { transform: rotate(180deg); }
.card-asunto {
  font-size: 14px; font-weight: 600; color: var(--text); margin-top: 6px;
  line-height: 1.4; overflow-wrap: anywhere;
}
.card-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

/* ── TICKET CARD (Planet desktop) ── */
.ticket-details { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--card-border); }
.ticket-card.open .ticket-details { display: block; }
.ticket-details .ticket-thread { border-top: none; padding-top: 0; }
.ticket-card {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: var(--radius); padding: 12px 14px 12px 0;
  margin-bottom: 10px; display: flex; gap: 12px;
  transition: box-shadow 0.15s, border-color 0.15s;
}
.ticket-card:hover { box-shadow: var(--shadow-md); border-color: var(--primary); }
.ticket-stripe {
  width: 4px; border-radius: 0 2px 2px 0; flex-shrink: 0; align-self: stretch;
}
.ticket-stripe.abierto { background: var(--warning); }
.ticket-stripe.proceso { background: var(--info); }
.ticket-stripe.cerrado { background: var(--closed); }
.ticket-stripe.espera { background: var(--wait); }
.ticket-stripe.urgent { background: var(--danger); }
.ticket-stripe.planet-query { background: var(--purple); }

.ticket-body { flex: 1; min-width: 0; }
.ticket-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
.ticket-tracking { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ticket-client-tag {
  font-size: 11px; font-weight: 600; padding: 2px 8px;
  border-radius: 10px; letter-spacing: 0.02em;
}
.tag-NUME { background: #fef3c7; color: #92400e; }
.tag-GETBOX { background: #dbeafe; color: #1e40af; }
.tag-Morocogorwshop { background: #ede9fe; color: #5b21b6; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .tag-NUME { background: #78350f; color: #fde68a; }
  :root:not([data-theme="light"]) .tag-GETBOX { background: #1e3a5f; color: #93c5fd; }
  :root:not([data-theme="light"]) .tag-Morocogorwshop { background: #4c1d95; color: #c4b5fd; }
}
:root[data-theme="dark"] .tag-NUME { background: #78350f; color: #fde68a; }
:root[data-theme="dark"] .tag-GETBOX { background: #1e3a5f; color: #93c5fd; }
:root[data-theme="dark"] .tag-Morocogorwshop { background: #4c1d95; color: #c4b5fd; }

.ticket-direction-tag {
  font-size: 10px; font-weight: 700; padding: 2px 7px;
  border-radius: 10px; letter-spacing: 0.03em; text-transform: uppercase;
}
.dir-incoming { background: var(--warning-bg); color: var(--warning-text); }
.dir-outgoing { background: var(--purple-bg); color: var(--purple-text); }

.ticket-datetime { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; margin-left: auto; }
.ticket-problem { font-size: 14px; color: var(--text); line-height: 1.4; margin-bottom: 8px; }
.ticket-footer { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ticket-status { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 10px; }
.status-Abierto { background: var(--warning-bg); color: var(--warning-text); }
.status-En-proceso { background: var(--info-bg); color: var(--info-text); }
.status-Cerrado { background: var(--closed-bg); color: var(--closed-text); }
.status-Respondido { background: var(--success-bg); color: var(--success-text); }
.status-Esperando { background: var(--purple-bg); color: var(--purple-text); }
.status-Esperando-info { background: var(--wait-bg); color: var(--wait-text); }
.tag-respondio {
  font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px;
  background: var(--success-bg); color: var(--success-text); white-space: nowrap;
}
.thread-reply-btn.btn-wait { background: var(--wait); color: var(--surface); }
.consulta-card.needs-reply { border-left: 3px solid var(--wait); }
.alert-banner.alert-wait { background: var(--wait-bg); color: var(--wait-text); border: 1px solid var(--wait); }

.ticket-who { font-size: 12px; color: var(--text-muted); }

/* ── STATUS ACTIONS ── */
.status-actions {
  display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--card-border);
}
.status-btn {
  font-family: var(--font); font-size: 12px; font-weight: 600;
  padding: 6px 14px; border-radius: 6px; border: 1.5px solid var(--card-border);
  background: var(--card); color: var(--text-secondary); cursor: pointer; transition: all 0.15s;
}
.status-btn:hover { border-color: var(--primary); color: var(--primary); }
.status-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.status-btn.btn-proceso { border-color: var(--info); color: var(--info); background: var(--info-bg); }
.status-btn.btn-espera { border-color: var(--wait); color: var(--wait); background: var(--wait-bg); }
.status-btn.btn-cerrar { border-color: var(--success); color: var(--success); background: var(--success-bg); }

/* ── THREAD / CONVERSATION ── */
.ticket-thread {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--card-border);
}
.thread-msg { display: flex; gap: 10px; padding: 8px 0; }
.thread-msg + .thread-msg { border-top: 1px solid var(--card-border); }
.thread-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0; margin-top: 2px;
}
.thread-content { flex: 1; min-width: 0; }
.thread-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
.thread-name { font-size: 12px; font-weight: 600; }
.thread-time { font-size: 11px; color: var(--text-muted); }
.thread-text { font-size: 13px; color: var(--text-secondary); line-height: 1.45; }
.thread-reply-bar {
  display: flex; gap: 8px; margin-top: 8px; padding-top: 8px;
  border-top: 1px dashed var(--card-border);
}
.thread-reply-input {
  flex: 1; padding: 8px 12px; border: 1.5px solid var(--input-border);
  border-radius: var(--radius-sm); background: var(--input-bg);
  font-family: var(--font); font-size: 13px; color: var(--text); outline: none;
}
.thread-reply-input:focus { border-color: var(--primary); }
.thread-reply-btn {
  padding: 8px 14px; background: var(--primary); color: #fff; border: none;
  border-radius: var(--radius-sm); font-family: var(--font);
  font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.thread-reply-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── CONSULTA CARD (client mobile) ── */
.consulta-card {
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: var(--radius); overflow: hidden; margin-bottom: 10px;
}
.consulta-header { padding: 12px 14px; }
.consulta-left { display: flex; align-items: flex-start; gap: 10px; flex: 1; min-width: 0; }
.consulta-icon {
  width: 36px; height: 36px; border-radius: 50%;
  display: grid; place-items: center; flex-shrink: 0; margin-top: 2px;
}
.consulta-icon.abierto-icon { background: var(--warning-bg); color: var(--warning); }
.consulta-icon.proceso-icon { background: var(--info-bg); color: var(--info); }
.consulta-icon.cerrado-icon { background: var(--closed-bg); color: var(--closed); }
.consulta-icon.planet-icon { background: var(--purple-bg); color: var(--purple); }
.consulta-icon.esperando-icon { background: var(--purple-bg); color: var(--purple); }
.consulta-icon.respondido-icon { background: var(--success-bg); color: var(--success); }
.consulta-title { font-size: 14px; font-weight: 500; }
.consulta-date { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.consulta-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.consulta-detail {
  padding: 0 14px 14px 14px; font-size: 13px;
  color: var(--text-secondary); line-height: 1.5; display: none;
}
.consulta-card.open .consulta-detail { display: block; }
.timeline-item { padding: 8px 0; border-top: 1px solid var(--card-border); }
.timeline-who { font-weight: 600; font-size: 12px; }
.timeline-time { font-size: 11px; color: var(--text-muted); margin-left: 6px; }

/* ── REPLY BOX (client mobile) ── */
.reply-box {
  padding: 10px 14px 14px; border-top: 1px dashed var(--card-border);
  display: none; gap: 8px; align-items: flex-end;
}
.consulta-card.open .reply-box { display: flex; }
.reply-box input {
  flex: 1; padding: 10px 12px; border: 1.5px solid var(--input-border);
  border-radius: 20px; background: var(--input-bg);
  font-family: var(--font); font-size: 14px; color: var(--text); outline: none;
}
.reply-box input:focus { border-color: var(--primary); }
.reply-send {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--primary); color: #fff; border: none;
  display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
}
.reply-send:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── SUBTAB BAR (client) ── */
.subtab-bar {
  position: relative; display: flex; gap: 0; margin-bottom: 16px; padding: 3px;
  border-radius: 10px; border: 1.5px solid var(--card-border); background: var(--card);
}
.subtab {
  flex: 1; padding: 9px 8px; font-family: var(--font);
  font-size: 13px; font-weight: 600; text-align: center;
  border: none; background: none; color: var(--text-muted); border-radius: 7px;
  cursor: pointer; transition: color 0.25s; position: relative; overflow: hidden;
}
.subtab.active { color: #fff; }
.subtab-bar:not(.has-ind) .subtab.active { background: var(--primary); }
.subtab-bar > .tab-ind {
  position: absolute; top: 3px; bottom: 3px; left: 0; width: 0;
  border-radius: 7px; background: var(--primary);
}
.subtab .subtab-badge {
  display: inline-block; min-width: 18px; padding: 1px 5px;
  font-size: 10px; font-weight: 700; border-radius: 10px;
  margin-left: 5px; vertical-align: middle;
}
.subtab .subtab-badge[hidden] { display: none; }
.client-chip .cnt { margin-left: 2px; font-weight: 700; font-variant-numeric: tabular-nums; opacity: 0.75; }
.subtab.active .subtab-badge { background: rgba(255,255,255,0.25); color: #fff; }
.subtab:not(.active) .subtab-badge { background: var(--danger); color: #fff; }
.client-sub { display: none; }
.client-sub.active { display: block; }

/* ── BOTTOM TAB BAR (mobile) ── */
.tab-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--tab-bar-bg); border-top: 1px solid var(--tab-bar-border);
  display: flex; justify-content: center;
  padding: 6px 0 env(safe-area-inset-bottom, 8px); z-index: 50;
}
.tab-bar-inner { display: flex; width: 100%; max-width: 420px; justify-content: space-around; }
.tab-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 12px; border: none; background: none; cursor: pointer;
  font-family: var(--font); color: var(--text-muted); transition: color 0.15s;
}
.tab-item.active { color: var(--primary); }
.tab-item svg { width: 22px; height: 22px; }
.tab-item span { font-size: 10px; font-weight: 600; letter-spacing: 0.02em; }

/* ── FAB ── */
.fab {
  position: fixed; bottom: 80px; right: 20px;
  width: 52px; height: 52px; background: var(--primary); color: #fff;
  border: none; border-radius: 50%;
  box-shadow: 0 4px 16px rgba(37,99,235,0.35);
  display: grid; place-items: center; cursor: pointer; z-index: 40;
  transition: transform 0.15s;
}
.fab:hover { transform: scale(1.08); }
/* Con una consulta abierta, el "+" se esconde para no taparle el botón de enviar */
.fab.oculto { opacity: 0; transform: scale(0.6) translateY(10px); pointer-events: none; }
.fab { transition: transform 0.2s, opacity 0.2s; }
.fab svg { width: 24px; height: 24px; }

/* ── MARCO DEL CLIENTE: celular por defecto, más ancho en computadora ── */
.mobile-frame { max-width: 420px; margin: 0 auto; padding: 0 16px 80px; position: relative; }

/* Computadora o tablet: aprovecha el ancho y saca la barra de abajo (que es de celular) */
@media (min-width: 760px) {
  .mobile-frame { max-width: 880px; padding: 0 24px 32px; }
  .tab-bar { display: none; }
  .fab { bottom: 28px; right: 28px; width: 56px; height: 56px; }
  .consulta-header { padding: 14px 18px; }
  .consulta-detail { padding: 0 18px 16px; }
  .reply-box { padding: 12px 18px 16px; }
  .card-asunto { font-size: 15px; }
  .stats-row { gap: 14px; }
  .modal-overlay { align-items: center; }
  .modal-content { border-radius: var(--radius); max-width: 520px; padding: 24px; }
}

/* ── DESKTOP FRAME (Planet) ── */
.desktop-frame { max-width: 960px; margin: 0 auto; padding: 0 16px; }
.desktop-layout { display: flex; gap: 0; min-height: calc(100vh - 65px); }
.sidebar {
  width: 220px; flex-shrink: 0; padding: 16px 0;
  border-right: 1px solid var(--card-border); background: var(--card);
  border-radius: var(--radius) 0 0 var(--radius);
}
.sidebar-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; font-size: 13px; font-weight: 500;
  color: var(--text-secondary); cursor: pointer; transition: all 0.12s;
  border: none; background: none; width: 100%; text-align: left;
  font-family: var(--font); position: relative;
}
.sidebar-item:hover { background: var(--surface); color: var(--text); }
.sidebar-item.active { color: var(--primary); background: var(--primary-light); font-weight: 600; }
.sidebar-item.active::before {
  content: ''; position: absolute; left: 0; top: 4px; bottom: 4px;
  width: 3px; border-radius: 0 2px 2px 0; background: var(--primary);
}
.sidebar-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar { position: relative; }
.sidebar > .tab-ind { position: absolute; top: 0; left: 0; right: 0; height: 0; background: var(--primary-light); }
.sidebar > .tab-ind::before {
  content: ''; position: absolute; left: 0; top: 4px; bottom: 4px;
  width: 3px; border-radius: 0 2px 2px 0; background: var(--primary);
}
.sidebar.has-ind .sidebar-item.active { background: transparent; }
.sidebar.has-ind .sidebar-item.active::before { display: none; }
.sidebar-badge {
  margin-left: auto; font-size: 11px; font-weight: 700;
  background: var(--danger); color: #fff; padding: 1px 7px;
  border-radius: 10px; min-width: 20px; text-align: center;
}
.sidebar-badge.purple-badge { background: var(--purple); }
.sidebar-sep { height: 1px; background: var(--card-border); margin: 8px 16px; }
.main-content { flex: 1; padding: 16px 20px; min-width: 0; }

/* ── PLANET TAB TOGGLE ── */
.planet-tab-bar {
  display: flex; gap: 0; margin-bottom: 18px;
  border-radius: var(--radius-sm); overflow: hidden; border: 1.5px solid var(--card-border);
}
.planet-tab {
  flex: 1; padding: 10px 16px; font-family: var(--font);
  font-size: 13px; font-weight: 600; text-align: center;
  border: none; background: var(--card); color: var(--text-muted);
  cursor: pointer; transition: all 0.15s;
}
.planet-tab.active { background: var(--primary); color: #fff; }
.planet-tab:not(:last-child) { border-right: 1.5px solid var(--card-border); }
.planet-tab .ptab-badge {
  display: inline-block; min-width: 18px; padding: 1px 5px;
  font-size: 10px; font-weight: 700; border-radius: 10px;
  margin-left: 5px; vertical-align: middle;
}
.planet-tab.active .ptab-badge { background: rgba(255,255,255,0.25); color: #fff; }
.planet-tab:not(.active) .ptab-badge { background: var(--danger); color: #fff; }
.planet-sub { display: none; }
.planet-sub.active { display: block; }

/* ── NEW QUERY FORM ── */
.new-query-form {
  background: var(--card); border: 1.5px solid var(--primary);
  border-radius: var(--radius); padding: 20px; margin-bottom: 20px;
  box-shadow: var(--shadow-md);
}
.new-query-form h3 {
  font-size: 15px; font-weight: 700; margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}
.new-query-form h3 svg { width: 18px; height: 18px; flex-shrink: 0; }
.form-row { display: flex; gap: 12px; margin-bottom: 12px; }
.form-row .field { flex: 1; }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
.btn-secondary {
  padding: 10px 20px; border: 1.5px solid var(--card-border);
  border-radius: var(--radius-sm); background: var(--card);
  font-family: var(--font); font-size: 14px; font-weight: 600;
  color: var(--text-secondary); cursor: pointer;
}
.btn-send {
  padding: 10px 20px; background: var(--primary); color: #fff; border: none;
  border-radius: var(--radius-sm); font-family: var(--font);
  font-size: 14px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; gap: 6px;
}
.btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── MODAL (new query client) ── */
.modal-overlay {
  position: fixed; inset: 0; background: var(--overlay);
  display: none; align-items: flex-end; justify-content: center;
  z-index: 100;
}
.modal-overlay.active { display: flex; }
.modal-content {
  background: var(--card); border-radius: var(--radius) var(--radius) 0 0;
  width: 100%; max-width: 420px; padding: 20px 16px 32px;
  max-height: 80vh; overflow-y: auto;
}
.modal-title {
  font-size: 16px; font-weight: 700; margin-bottom: 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.modal-close {
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: var(--surface); display: grid; place-items: center;
  cursor: pointer; color: var(--text-muted);
}

/* ── LOADING SPINNER ── */
.spinner { display: flex; align-items: center; justify-content: center; padding: 40px; }
.spinner::after {
  content: ''; width: 28px; height: 28px; border: 3px solid var(--card-border);
  border-top-color: var(--primary); border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.icon-btn.spinning svg { animation: spin 0.9s linear infinite; }
.btn-loading { position: relative; pointer-events: none; opacity: 0.85; }
.btn-loading::before {
  content: ''; display: inline-block; width: 12px; height: 12px; margin-right: 6px;
  border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
  vertical-align: -2px; animation: spin 0.7s linear infinite;
}
.reply-send.btn-loading::before { margin-right: 0; }
.reply-send.btn-loading svg { display: none; }
.card-busy { pointer-events: none; }

/* ── IMÁGENES ── */
.attach-btn {
  flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%;
  border: 1.5px solid var(--card-border); background: var(--card); color: var(--text-secondary);
  display: grid; place-items: center; cursor: pointer; transition: all 0.15s;
}
.attach-btn:hover { border-color: var(--primary); color: var(--primary); }
.attach-btn svg { width: 18px; height: 18px; }
.attach-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.attach-row .attach-hint { font-size: 12px; color: var(--text-muted); }
.img-previews { display: flex; gap: 8px; flex-wrap: wrap; }
.img-previews:empty { display: none; }
.img-prev { position: relative; width: 60px; height: 60px; }
.img-prev img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid var(--card-border); }
.img-prev button {
  position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%;
  border: none; background: var(--danger); color: #fff; font-size: 12px; line-height: 20px;
  cursor: pointer; padding: 0;
}
.reply-previews { padding: 0 14px 10px; display: none; }
.consulta-card.open .reply-previews { display: flex; }
.reply-previews:empty { display: none !important; }
.thread-previews { margin-top: 8px; }
.msg-imgs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.msg-imgs img {
  width: 96px; height: 96px; object-fit: cover; border-radius: 8px; cursor: zoom-in;
  border: 1px solid var(--card-border); background: var(--surface);
}
.lightbox {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 300;
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px;
}
.lightbox.active { display: flex; }
.lightbox img { max-width: 100%; max-height: calc(100vh - 90px); border-radius: 8px; background: #111; }
.lightbox a { color: #fff; font-size: 13px; }
.lightbox-close {
  position: absolute; top: 12px; right: 12px; width: 38px; height: 38px; border-radius: 50%;
  border: none; background: rgba(255,255,255,0.15); color: #fff; font-size: 18px; cursor: pointer;
}
.card-busy .ticket-details, .card-busy .consulta-detail, .card-busy .reply-box { opacity: 0.6; }

/* ── ANIMACIONES ── */
:root { --ease-spring: cubic-bezier(.34,1.4,.64,1); }
.screen.active { animation: aparecer 0.3s ease-out; }
@keyframes aparecer { from { opacity: 0; } }
.fab:active { transform: scale(0.92); }

/* Aviso (toast) que se estira como líquido */
.sl-host {
  position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 0; right: 0;
  height: 0; z-index: 400; pointer-events: none;
}
.sl { position: absolute; left: 50%; top: 0; }
.sl-goo { position: absolute; left: 0; top: 0; filter: url(#goo) drop-shadow(0 6px 14px rgba(0,0,0,0.18)); }
.sl-head, .sl-body { position: absolute; left: 0; top: 0; background: var(--toast-bg); transform: translateX(-50%); }
.sl-head { height: 36px; width: 36px; border-radius: 18px; }
.sl-body { top: 28px; width: 36px; height: 0; border-radius: 16px; }
.sl-content { position: absolute; left: 0; top: 0; transform: translateX(-50%); }
.sl-row {
  height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 14px 0 6px;
  white-space: nowrap; max-width: calc(100vw - 32px);
}
.sl-badge { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; }
.sl-badge svg { width: 14px; height: 14px; }
.sl-title { font-size: 13.5px; font-weight: 600; opacity: 0; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sl-desc {
  position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
  padding: 0 16px; font-size: 13px; line-height: 1.4; color: var(--toast-desc); opacity: 0;
}
.t-success .sl-badge { background: rgba(52,211,153,.18); color: #34d399; } .t-success .sl-title { color: #6ee7b7; }
.t-error .sl-badge { background: rgba(248,113,113,.18); color: #f87171; } .t-error .sl-title { color: #fca5a5; }
.t-warn .sl-badge { background: rgba(251,191,36,.18); color: #fbbf24; } .t-warn .sl-title { color: #fcd34d; }
.t-info .sl-badge { background: rgba(96,165,250,.2); color: #60a5fa; } .t-info .sl-title { color: #93c5fd; }
.t-load .sl-badge { color: #e2e8f0; } .t-load .sl-title { color: #e2e8f0; }
.t-load .sl-badge svg { animation: spin 0.8s linear infinite; }

/* Esqueleto mientras carga */
.skel-list { display: flex; flex-direction: column; gap: 10px; }
.skel-card {
  background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius);
  padding: 14px; display: flex; flex-direction: column; gap: 10px;
}
.skel-top { display: flex; gap: 10px; align-items: center; }
.skel {
  display: block; height: 11px; border-radius: 6px;
  background: linear-gradient(90deg, var(--skel) 0%, var(--skel-hi) 45%, var(--skel) 90%);
  background-size: 250% 100%; animation: brillo 1.3s ease-in-out infinite;
}
@keyframes brillo { from { background-position: 100% 0; } to { background-position: -150% 0; } }

/* Consulta nueva o con novedades */
.card-nueva { animation: resaltar 1.8s ease-out 0.25s backwards; }
@keyframes resaltar { from { background-color: var(--primary-light); } }

/* Onda al tocar botones */
.btn-primary, .btn-send, .reply-send, .thread-reply-btn, .status-btn, .client-chip, .icon-btn { position: relative; overflow: hidden; }
.fab { overflow: hidden; }
.ripple {
  position: absolute; border-radius: 50%; pointer-events: none;
  background: currentColor; opacity: 0; transform: scale(0);
}

/* Números que ruedan */
.stat-number.rodando { display: inline-flex; height: 1em; overflow: hidden; }
.stat-number .dg { display: block; height: 1em; overflow: hidden; }
.stat-number .strip { display: flex; flex-direction: column; transition: transform 0.9s var(--ease-spring); }
.stat-number .strip span { display: block; height: 1em; line-height: 1; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── POST-ITS de Planet: se pegan y arrastran sobre la pantalla ── */
.nota-amarillo { --nota-bg: var(--n-amarillo); }
.nota-rosa { --nota-bg: var(--n-rosa); }
.nota-verde { --nota-bg: var(--n-verde); }
.nota-celeste { --nota-bg: var(--n-celeste); }
.nota-violeta { --nota-bg: var(--n-violeta); }
#screen-planet { position: relative; }
.notas-capa { position: absolute; left: 0; top: 0; width: 100%; height: 0; z-index: 45; }
.postit {
  position: absolute; width: 210px; display: flex; flex-direction: column;
  background: var(--nota-bg); color: var(--nota-text);
  border-radius: 4px 4px 16px 4px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.1), 0 10px 22px rgba(0,0,0,0.16);
  transform: rotate(var(--rot, 0deg)); transition: transform 0.35s var(--ease-spring), box-shadow 0.2s;
}
.postit.fija { position: fixed; }
.postit:hover, .postit:focus-within { transform: rotate(0deg); }
.postit.arrastrando { transform: rotate(0deg) scale(1.04); box-shadow: 0 4px 8px rgba(0,0,0,0.12), 0 22px 40px rgba(0,0,0,0.24); }
.postit-barra {
  display: flex; align-items: center; gap: 0; padding: 3px 3px 0 6px; height: 30px;
  cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
}
.postit.arrastrando .postit-barra { cursor: grabbing; }
.postit-grip { flex: 1; display: flex; align-items: center; opacity: 0.35; }
.postit-grip svg { width: 18px; height: 18px; }
.postit-texto {
  width: 100%; border: none; background: transparent; resize: none; outline: none; padding: 2px 12px 4px;
  font-family: var(--font); font-size: 14px; line-height: 1.45; color: inherit;
  min-height: 84px; max-height: 300px; field-sizing: content;
}
.postit-texto::placeholder { color: inherit; opacity: 0.45; }
.postit-pie { display: flex; align-items: center; gap: 6px; padding: 0 10px 7px 12px; font-size: 11px; min-height: 22px; }
.postit-resumen {
  display: none; padding: 0 12px 8px; font-size: 13px; font-weight: 600; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.postit.min { width: 160px; }
.postit.min .postit-texto, .postit.min .postit-pie { display: none; }
.postit.min .postit-resumen { display: block; }
.nota-colores { display: flex; gap: 5px; opacity: 0; transition: opacity 0.15s; }
.postit:hover .nota-colores, .postit:focus-within .nota-colores { opacity: 1; }
.nota-color { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid rgba(0,0,0,0.25); cursor: pointer; padding: 0; background: var(--nota-bg); }
.nota-color.on { box-shadow: 0 0 0 2px var(--nota-text); }
.nota-estado { margin-left: auto; white-space: nowrap; opacity: 0.6; }
.nota-btn {
  width: 26px; height: 26px; border-radius: 50%; border: none; background: transparent; color: inherit;
  display: grid; place-items: center; cursor: pointer; opacity: 0.55; flex-shrink: 0;
}
.nota-btn:hover { opacity: 1; background: rgba(0,0,0,0.08); }
.nota-btn svg { width: 15px; height: 15px; }
.nota-pin.on { opacity: 1; color: var(--danger); }
.nota-pin.on svg { fill: currentColor; }
.btn-nota { background: var(--n-amarillo); border-color: transparent; color: var(--nota-text); }
.btn-nota:hover { border-color: var(--warning); color: var(--nota-text); }

/* ── GUÍA PARA CLIENTES NUEVOS ── */
.guia { position: fixed; inset: 0; z-index: 500; }
.guia-foco {
  position: fixed; border-radius: 12px; pointer-events: none;
  box-shadow: 0 0 0 3px rgba(255,255,255,0.9), 0 0 0 9999px rgba(8,12,20,0.62);
  transition: left 0.45s var(--ease-spring), top 0.45s var(--ease-spring), width 0.45s var(--ease-spring), height 0.45s var(--ease-spring);
}
.guia-foco.sin-objetivo { box-shadow: 0 0 0 9999px rgba(8,12,20,0.62); }
.guia-card {
  position: fixed; width: min(340px, calc(100vw - 32px)); background: var(--card); color: var(--text);
  border-radius: 14px; padding: 18px 18px 14px; box-shadow: var(--shadow-lg);
  transition: left 0.45s var(--ease-spring), top 0.45s var(--ease-spring);
}
.guia-paso { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--primary); }
.guia-card h3 { font-size: 17px; margin: 4px 0 6px; text-wrap: balance; }
.guia-card p { font-size: 14px; color: var(--text-secondary); line-height: 1.5; }
.guia-puntos { display: flex; gap: 5px; margin-top: 14px; }
.guia-puntos span { width: 6px; height: 6px; border-radius: 3px; background: var(--card-border); transition: width 0.3s var(--ease-spring), background 0.3s; }
.guia-puntos span.on { width: 18px; background: var(--primary); }
.guia-botones { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
.guia-saltar { margin-right: auto; background: none; border: none; color: var(--text-muted); font: 500 13px var(--font); cursor: pointer; padding: 6px 0; }
.guia-atras {
  padding: 8px 14px; border: 1.5px solid var(--card-border); border-radius: var(--radius-sm); background: var(--card);
  color: var(--text-secondary); font: 600 13px var(--font); cursor: pointer;
}
.guia-sig { padding: 8px 16px; border: none; border-radius: var(--radius-sm); background: var(--primary); color: #fff; font: 600 13px var(--font); cursor: pointer; }

@media (prefers-reduced-motion: reduce) {
  .guia-foco, .guia-card, .nota { transition: none; }
  .screen.active, .card-nueva, .skel, .t-load .sl-badge svg { animation: none; }
  .card-chevron, .stat-number .strip { transition: none; }
}

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center; padding: 40px 20px; color: var(--text-muted);
}
.empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.4; }

@media (max-width: 700px) {
  .sidebar { display: none; }
  .main-content { padding: 16px 0; }
  .form-row { flex-direction: column; gap: 10px; }
  .desktop-frame { padding: 0 16px; }
}
</style>

<script>
// ── CONFIG ──

let currentUser = null;     // {usuario, nombre, team, cliente, role}

// ── HELPERS ──
function $(id) { return document.getElementById(id); }

// ═══ ANIMACIONES ═══
// Sin librerías: animaciones del navegador + curvas de "resorte" (rebote suave).
const SIN_MOVIMIENTO = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const EASE_OUT = 'cubic-bezier(.22,1,.36,1)';
const LINEAR_OK = !!(window.CSS && CSS.supports && CSS.supports('transition-timing-function', 'linear(0, 1)'));
const _resortes = {};

// Simula un resorte y lo convierte en una curva CSS linear(); devuelve { easing, duracion }
function resorte(rigidez = 260, freno = 22) {
  const k = rigidez + ':' + freno;
  if (_resortes[k]) return _resortes[k];
  let x = 0, v = 0, t = 0;
  const dt = 1 / 240, pts = [0];
  while (t < 2.5) {
    v += (-rigidez * (x - 1) - freno * v) * dt;
    x += v * dt; t += dt;
    pts.push(x);
    if (t > 0.2 && Math.abs(x - 1) < 0.002 && Math.abs(v) < 0.02) break;
  }
  const paso = Math.max(1, Math.round(pts.length / 60)), s = [];
  for (let i = 0; i < pts.length; i += paso) s.push(pts[i].toFixed(4));
  s.push('1');
  return _resortes[k] = {
    easing: LINEAR_OK ? `linear(${s.join(',')})` : 'cubic-bezier(.34,1.4,.64,1)',
    duracion: Math.round(t * 1000)
  };
}
if (LINEAR_OK) document.documentElement.style.setProperty('--ease-spring', resorte(170, 20).easing);

// Anima un elemento. mantener=true deja aplicado el valor final; false vuelve a su estilo normal.
function anim(el, kf, o = {}) {
  if (!el || !el.animate) return Promise.resolve();
  el.getAnimations().forEach(a => {
    const deCss = (window.CSSAnimation && a instanceof CSSAnimation) || (window.CSSTransition && a instanceof CSSTransition);
    if (!deCss) a.cancel();
  });
  if (o.mantener !== false) for (const p in kf) el.style[p] = kf[p][kf[p].length - 1];
  if (SIN_MOVIMIENTO) return Promise.resolve();
  let duracion = o.duracion || 300, easing = o.easing || EASE_OUT;
  if (o.resorte) { const r = resorte(...o.resorte); duracion = r.duracion; easing = r.easing; }
  const a = el.animate(kf, { duration: duracion, delay: o.retraso || 0, easing, fill: o.fill || 'backwards' });
  return a.finished.then(() => {}, () => {});
}
function esperar(ms) { return new Promise(r => setTimeout(r, SIN_MOVIMIENTO ? 0 : ms)); }

// Los elementos entran uno detrás del otro
function entrada(elems, desde = 'translateY(10px)', paso = 40) {
  Array.from(elems || []).slice(0, 14).forEach((e, i) => {
    const op = getComputedStyle(e).opacity;
    anim(e, { opacity: [0, op], transform: [desde, 'none'] }, { duracion: 380, retraso: i * paso, mantener: false });
  });
}
// Tiembla para avisar que falta algo
function sacudir(el) {
  anim(el, { transform: ['translateX(0)', 'translateX(-7px)', 'translateX(6px)', 'translateX(-4px)', 'translateX(2px)', 'translateX(0)'] },
    { duracion: 420, easing: 'ease-out', mantener: false });
}
function sacudirVacios(ids) {
  ids.forEach(id => { const el = $(id); if (el && !String(el.value || '').trim()) sacudir(el); });
}
// Salta (para contadores que suben)
function saltar(el) { anim(el, { transform: ['scale(0.4)', 'scale(1)'] }, { resorte: [500, 14], mantener: false }); }
// Resalta una tarjeta nueva o con novedades
function resaltar(el) {
  if (!el) return;
  anim(el, { transform: ['scale(0.97)', 'none'] }, { resorte: [300, 20], mantener: false });
  el.classList.remove('card-nueva'); void el.offsetWidth; el.classList.add('card-nueva');
  el.addEventListener('animationend', () => el.classList.remove('card-nueva'), { once: true });
}

// ── Aviso "líquido": nace como un punto, se estira y abre la explicación debajo ──
const TOAST_ICONOS = {
  success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
  error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 7v6M12 17h.01"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 7v6M12 17h.01"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 11v6M12 7h.01"/></svg>',
  load: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/></svg>'
};
const TOAST_TITULOS = { success: 'Listo', error: 'No se pudo completar', warn: 'Falta completar', info: 'Aviso' };

// Convierte los textos de siempre ("✓ Mensaje enviado", "Error: ...") en tipo + título + detalle
function armarToast(msg) {
  let s = String(msg || '').trim(), tipo = 'info', titulo = s, desc = '';
  if (/^✓/.test(s)) { tipo = 'success'; s = s.replace(/^✓\s*/, ''); }
  else if (/^📎/.test(s)) { tipo = 'info'; s = s.replace(/^📎\s*/, ''); }
  else if (/^(Error|No se pudo|No podés)/i.test(s)) tipo = 'error';
  else if (/^(Completá|Ingresá|Escribí|Máximo|Solo se|Sesión vencida)/i.test(s)) tipo = 'warn';
  else if (/(creada|creado|enviada|actualizado|eliminado|cambiado)/i.test(s)) tipo = 'success';
  titulo = s;
  let partes = s.split(' — ');
  titulo = partes[0];
  const extra = partes.slice(1).join('. ');
  const dosPuntos = titulo.indexOf(': ');
  if (dosPuntos > 0 && dosPuntos < 32) { desc = titulo.slice(dosPuntos + 2); titulo = titulo.slice(0, dosPuntos); }
  else if (titulo.indexOf(' · ') > 0) { const i = titulo.indexOf(' · '); desc = titulo.slice(i + 3); titulo = titulo.slice(0, i); }
  if (titulo === 'Error') titulo = TOAST_TITULOS.error;
  if (extra) desc = (desc ? desc.replace(/\.?$/, '. ') : '') + extra.charAt(0).toUpperCase() + extra.slice(1);
  if (titulo.length > 34 && !desc) { desc = titulo; titulo = TOAST_TITULOS[tipo]; }
  return { tipo, titulo, desc };
}

let _t = null, _tCadena = Promise.resolve(), _tGen = 0;
function toast(msg, opciones) { mostrarToast(Object.assign(armarToast(msg), opciones || {})); }
toast.cargando = titulo => mostrarToast({ tipo: 'load', titulo, desc: '', fijo: true });

function mostrarToast(o) {
  const gen = ++_tGen;
  _tCadena = _tCadena.then(() => pasoToast(o, gen)).catch(() => {});
}
function hostToast() {
  let h = document.querySelector('.sl-host');
  if (!h) {
    h = document.createElement('div');
    h.className = 'sl-host';
    h.setAttribute('role', 'status');
    h.setAttribute('aria-live', 'polite');
    document.body.appendChild(h);
  }
  return h;
}
async function pasoToast(o, gen) {
  if (!_t) {
    const el = document.createElement('div');
    el.className = 'sl';
    el.innerHTML = '<div class="sl-goo"><div class="sl-head"></div><div class="sl-body"></div></div>' +
      '<div class="sl-content"><div class="sl-row"><span class="sl-badge"></span><span class="sl-title"></span></div></div>' +
      '<div class="sl-desc"></div>';
    hostToast().appendChild(el);
    _t = { el, ancho: 36, cuerpo: false };
    anim(el, { transform: ['scale(0.3)', 'scale(1)'], opacity: [0, 1] }, { resorte: [400, 22] });
    await esperar(80);
  } else if (_t.cuerpo) {
    await cerrarCuerpoToast();
  }
  await cabezaToast(o.tipo, o.titulo);
  if (o.desc) { await esperar(100); await abrirCuerpoToast(o.desc); }
  if (!o.fijo) {
    const dura = (o.tipo === 'error' ? 4500 : 2600) + (o.desc ? 1200 : 0);
    setTimeout(() => {
      if (gen === _tGen) _tCadena = _tCadena.then(() => (gen === _tGen ? cerrarToast() : null)).catch(() => {});
    }, dura);
  }
}
async function cabezaToast(tipo, titulo) {
  const el = _t.el, q = s => el.querySelector(s);
  el.className = 'sl t-' + tipo;
  q('.sl-badge').innerHTML = TOAST_ICONOS[tipo] || TOAST_ICONOS.info;
  q('.sl-title').textContent = titulo;
  const w = Math.ceil(q('.sl-row').getBoundingClientRect().width);
  anim(q('.sl-title'), { opacity: [0, 1], transform: ['translateX(-6px)', 'none'] }, { duracion: 260, retraso: 110 });
  await anim(q('.sl-head'), { width: [_t.ancho + 'px', w + 'px'] }, { resorte: [320, 24] });
  _t.ancho = w;
}
async function abrirCuerpoToast(desc) {
  const el = _t.el, d = el.querySelector('.sl-desc'), body = el.querySelector('.sl-body');
  const dw = Math.max(_t.ancho, Math.min(320, window.innerWidth - 32));
  d.style.width = dw + 'px';
  d.textContent = desc;
  const h = Math.ceil(d.getBoundingClientRect().height) + 20;
  _t.cuerpo = true;
  anim(d, { opacity: [0, 1], transform: ['translateX(-50%) translateY(-6px)', 'translateX(-50%)'] }, { duracion: 280, retraso: 130 });
  await anim(body, { width: [_t.ancho + 'px', dw + 'px'], height: ['0px', h + 'px'] }, { resorte: [260, 22] });
}
async function cerrarCuerpoToast() {
  const el = _t.el, body = el.querySelector('.sl-body');
  anim(el.querySelector('.sl-desc'), { opacity: [1, 0] }, { duracion: 140 });
  await anim(body, { width: [body.style.width || _t.ancho + 'px', _t.ancho + 'px'], height: [body.style.height || '0px', '0px'] }, { duracion: 220 });
  _t.cuerpo = false;
}
async function cerrarToast() {
  if (!_t) return;
  if (_t.cuerpo) await cerrarCuerpoToast();
  const el = _t.el;
  anim(el.querySelector('.sl-title'), { opacity: [1, 0] }, { duracion: 140 });
  await anim(el.querySelector('.sl-head'), { width: [_t.ancho + 'px', '36px'] }, { duracion: 220 });
  await anim(el, { transform: ['scale(1)', 'scale(0.4)'], opacity: [1, 0] }, { duracion: 180 });
  el.remove();
  _t = null;
}

// ── Esqueleto brillante mientras cargan las consultas ──
function esqueletoHtml(n = 3) {
  const a = [86, 72, 80], b = [52, 40, 60];
  let h = '<div class="skel-list" aria-label="Cargando...">';
  for (let i = 0; i < n; i++) {
    h += `<div class="skel-card"><div class="skel-top"><span class="skel" style="width:78px;height:18px;border-radius:10px"></span><span class="skel" style="width:96px"></span></div>` +
      `<span class="skel" style="width:${a[i % 3]}%"></span><span class="skel" style="width:${b[i % 3]}%"></span></div>`;
  }
  return h + '</div>';
}

// ── Pestañas y menú lateral: el fondo azul se desliza hasta la opción elegida ──
function moverIndicador(barra, activo, animar) {
  if (!barra || !activo || !activo.offsetWidth) return;
  let ind = barra.querySelector(':scope > .tab-ind');
  if (!ind) { ind = document.createElement('div'); ind.className = 'tab-ind'; barra.prepend(ind); }
  barra.classList.add('has-ind');
  const vertical = barra.classList.contains('sidebar');
  const tr = vertical ? `translateY(${activo.offsetTop}px)` : `translateX(${activo.offsetLeft}px)`;
  const prop = vertical ? 'height' : 'width';
  const tam = (vertical ? activo.offsetHeight : activo.offsetWidth) + 'px';
  if (!animar || !ind.style.transform) { ind.style.transform = tr; ind.style[prop] = tam; return; }
  anim(ind, { transform: [ind.style.transform, tr], [prop]: [ind.style[prop], tam] }, { resorte: [300, 26] });
}
function acomodarIndicadores() {
  document.querySelectorAll('.subtab-bar').forEach(b => moverIndicador(b, b.querySelector('.subtab.active'), false));

}
window.addEventListener('resize', acomodarIndicadores);

// ── Números que ruedan como un cuentakilómetros ──
const _numsPrevios = {};
function rodarNumeros(contId) {
  const cont = $(contId);
  if (!cont) return;
  const els = Array.from(cont.querySelectorAll('.stat-number'));
  const prev = _numsPrevios[contId];
  _numsPrevios[contId] = els.map(e => e.textContent.trim());
  if (SIN_MOVIMIENTO) return;
  els.forEach((el, i) => {
    const s = el.textContent.trim(), p = prev ? prev[i] : null;
    if (!/^\d+$/.test(s) || p === s) return;
    const desde = (p && p.length === s.length) ? p : '0'.repeat(s.length);
    const tira = '0123456789'.split('').map(d => `<span>${d}</span>`).join('');
    el.classList.add('rodando');
    el.innerHTML = `<span class="sr-only">${s}</span>` + s.split('').map((d, k) =>
      `<span class="dg" aria-hidden="true"><span class="strip" style="transform:translateY(-${desde[k]}em)">${tira}</span></span>`).join('');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.querySelectorAll('.strip').forEach((st, k) => {
        st.style.transitionDelay = (k * 80) + 'ms';
        st.style.transform = `translateY(-${s[k]}em)`;
      });
    }));
  });
}

// ── Contadores (globitos) que saltan cuando suben ──
function ponerContador(el, n) {
  if (!el) return;
  const antes = el.dataset.prev === undefined ? null : Number(el.dataset.prev);
  el.textContent = n;
  el.dataset.prev = n;
  if (antes !== null && n > antes) saltar(el);
}

// ── Consultas nuevas o con mensajes nuevos: entran resaltadas ──
let _vistos = null;  // id → { n: cantidad de mensajes, estado }
function marcarNovedades(lista, prefijo) {
  const antes = _vistos;
  _vistos = new Map(lista.map(c => [String(c.id), { n: (c.mensajes || []).length, estado: c.estado }]));
  if (!antes) return;
  lista.forEach(c => {
    const id = String(c.id), el = $(prefijo + id);
    if (!el) return;
    const a = antes.get(id), ahora = _vistos.get(id);
    if (!a) return resaltar(el);
    if (ahora.n > a.n && el.classList.contains('open')) {
      const msgs = el.querySelectorAll('.timeline-item, .thread-msg');
      entrada(Array.from(msgs).slice(-(ahora.n - a.n)), 'translateY(8px) scale(0.97)', 60);
    } else if (ahora.n > a.n || ahora.estado !== a.estado) {
      resaltar(el);
    }
  });
}

// ── Onda que sale desde el dedo al tocar un botón ──
document.addEventListener('pointerdown', e => {
  if (SIN_MOVIMIENTO) return;

  if (!b || b.disabled) return;

  const o = document.createElement('span');
  o.className = 'ripple';
  o.style.cssText = `width:${tam}px;height:${tam}px;left:${e.clientX - r.left - tam / 2}px;top:${e.clientY - r.top - tam / 2}px`;
  b.appendChild(o);
  o.animate({ transform: ['scale(0)', 'scale(1)'], opacity: [0.3, 0] }, { duration: 600, easing: 'ease-out' }).finished
    .then(() => o.remove(), () => o.remove());
});

function avatarColor(name) {
  const colors = ['#d97706','#2563eb','#7c3aed','#059669','#dc2626','#0891b2','#c026d3','#ea580c'];
  let h = 0;
  for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return colors[Math.abs(h) % colors.length];
}

let _jsonpId = 0;
// Acciones que se pueden repetir sin riesgo (solo leen datos o inician sesión)
const API_REINTENTABLES = ['login', 'consultas', 'clientes', 'usuarios', 'notas'];

// Llama al servidor. Cloudflare responde en ~200 ms, así que los tiempos de
// espera de abajo son de sobra: están por si el celular tiene mala señal.
// En acciones seguras (solo lecturas) reintenta hasta 3 veces.
async function api(params) {
  const seguro = API_REINTENTABLES.indexOf(params.action) >= 0;
  let res;
  for (let intento = 1; intento <= (seguro ? 3 : 1); intento++) {
    res = await apiOnce(Object.assign({}, params), seguro ? API_TIMEOUT_RAPIDO_MS : API_TIMEOUT_MS);
    if (!(res && res.timeout)) break;
  }
  // Sesión vencida o inválida: volver al login
  if (res && res.auth === false && currentUser) {
    doLogout(true);
    toast(res.error || 'Sesión vencida, ingresá de nuevo');
  }
  return res;
}

// Pedido normal (fetch). Si el navegador no lo permite, usa JSONP como respaldo.
async function apiOnce(params, timeoutMs) {
  if (currentUser && currentUser.token && !params.token) params.token = currentUser.token;
  const url = API + '?' + new URLSearchParams(params).toString();
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs || API_TIMEOUT_MS);
  try {
    const r = await fetch(url, { signal: ctrl.signal, redirect: 'follow' });
    const text = await r.text();
    try { return JSON.parse(text); }
    // No vino JSON: el servidor devolvió una página de error
    catch (e) { return NO_DISPONIBLE_RES(); }
  } catch (e) {
    if (e.name === 'AbortError') return TIMEOUT_RES();
    return apiJsonp(params);
  } finally {
    clearTimeout(timer);
  }
}

// Pedido POST (para subir imágenes, que no entran en una URL). Sin reintentos.
async function apiPost(params) {
  if (currentUser && currentUser.token && !params.token) params.token = currentUser.token;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 90000);
  try {
    // Sin cabeceras extra: así el navegador no hace el "preflight" de CORS
    const r = await fetch(API, { method: 'POST', body: JSON.stringify(params), signal: ctrl.signal, redirect: 'follow' });
    const text = await r.text();
    let res;
    try { res = JSON.parse(text); } catch (e) { return NO_DISPONIBLE_RES(); }
    if (res && res.auth === false && currentUser) { doLogout(true); toast(res.error || 'Sesión vencida, ingresá de nuevo'); }
    return res;
  } catch (e) {
    return e.name === 'AbortError' ? TIMEOUT_RES() : { ok: false, error: 'Error de conexión' };
  } finally {
    clearTimeout(timer);
  }
}

const API_TIMEOUT_MS = 30000;        // mensajes y cambios de estado (no se reintentan)
const API_TIMEOUT_RAPIDO_MS = 12000; // login y lecturas (se reintentan)
const TIMEOUT_RES = () => ({ ok: false, timeout: true, error: 'El servidor tardó demasiado en responder. Probá de nuevo en unos segundos.' });
const NO_DISPONIBLE_RES = () => ({ ok: false, timeout: true, error: 'El servidor no pudo atender el pedido en este momento. Probá de nuevo en unos segundos.' });

function apiJsonp(params) {
  return new Promise((resolve) => {
    const cbName = '_planet_cb_' + (++_jsonpId);
    params.callback = cbName;
    if (currentUser && currentUser.token && !params.token) params.token = currentUser.token;
    const qs = new URLSearchParams(params).toString();
    const url = API + '?' + qs;
    const script = document.createElement('script');
    const timeout = setTimeout(() => {
      cleanup();
      resolve(TIMEOUT_RES());
    }, API_TIMEOUT_MS);
    function cleanup() {
      clearTimeout(timeout);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = function(data) {
      cleanup();
      resolve(data);
    };
    script.src = url;
    script.onerror = function() {
      cleanup();
      resolve({ ok: false, error: 'Error de conexión' });
    };
    document.head.appendChild(script);
  });
}

// ── ACTUALIZACIÓN AUTOMÁTICA ──
// Cada 30 s el portal pregunta si hubo cambios. Esa pregunta es barata: el
// servidor devuelve un solo número (cuándo fue el último cambio), no las
// consultas. Recién si el número cambió vuelve a pedir la lista completa.
const REVISAR_CADA_MS = 30000;
let marcaCambios = 0;      // el último cambio que ya está en pantalla
let revisarTimer = null;
let revisando = false;

// No interrumpe a alguien que está en el medio de algo: al volver a dibujar
// la lista se borraría lo que está escribiendo. En ese caso espera al
// próximo turno, y ahí sí actualiza.
function estaOcupado() {
  if (document.querySelector('.modal-overlay.active')) return true;
  if (document.querySelector('#lightbox.active')) return true;
  const foco = document.activeElement;
  if (foco && (foco.tagName === 'INPUT' || foco.tagName === 'TEXTAREA')) return true;
  return [...document.querySelectorAll('input[id^="reply-"]')].some(i => i.value.trim() !== '');
}

async function revisarNovedades() {
  if (revisando || !currentUser || document.hidden) return;
  revisando = true;
  try {
    const res = await api({ action: 'novedades' });
    if (!res || !res.ok || !currentUser) return;
    if (Number(res.ultimo) === marcaCambios) return;   // no pasó nada
    if (estaOcupado()) return;                         // hay novedades, pero mejor no cortarle
    if (currentUser.team === 'planet') await loadPlanetData();
    else await loadClientData();
  } finally {
    revisando = false;
  }
}

function arrancarRevision() {
  pararRevision();
  revisarTimer = setInterval(revisarNovedades, REVISAR_CADA_MS);
}

function pararRevision() {
  if (revisarTimer) { clearInterval(revisarTimer); revisarTimer = null; }
}

// Con la pestaña en segundo plano no tiene sentido preguntar (y gasta
// pedidos al dope). Al volver a ella, revisa en el acto.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && currentUser) revisarNovedades();
});

// ── LOGIN ──
async function doLogin() {
  const user = $('login-user').value.trim();
  const pass = $('login-pass').value.trim();
  if (!user || !pass) {
    $('login-error').textContent = 'Completá usuario y contraseña';
    $('login-error').style.display = 'block';
    sacudirVacios(['login-user', 'login-pass']);
    return;
  }
  $('login-btn').disabled = true;
  $('login-btn').textContent = 'Ingresando...';
  $('login-error').style.display = 'none';

  const slow = setTimeout(() => { $('login-btn').textContent = 'Conectando con el servidor...'; }, 6000);
  const res = await api({ action: 'login', usuario: user, password: pass });
  clearTimeout(slow);
  $('login-btn').disabled = false;
  $('login-btn').textContent = 'Ingresar';

  if (!res.ok) {
    $('login-error').textContent = res.error || 'Error al ingresar';
    $('login-error').style.display = 'block';
    sacudir(document.querySelector('.login-form'));
    return;
  }

  currentUser = res.user;
  currentUser.token = res.token;
  datosMostrados = false;
  marcaCambios = Number(res.ultimo) || 0;
  arrancarRevision();
  try { localStorage.setItem('planet_user', JSON.stringify(currentUser)); } catch(e) {}

  // El servidor ya manda las consultas junto con el login: no hace falta otro pedido
  if (currentUser.team === 'planet') {
    notasData = [];
    setNotas(res.notas || []);
    initPlanetView(res.consultas);
  } else {
    initClientView(res.consultas);
  }
}

function doLogout(sessionAlreadyInvalid) {
  pararRevision();
  if (currentUser && currentUser.token && sessionAlreadyInvalid !== true) {
    api({ action: 'logout', token: currentUser.token });
  }
  borrarCache();
  try { localStorage.removeItem(notasKey()); } catch (e) {}
  currentUser = null;
  datosMostrados = false;
  _vistos = null;
  notasData = [];
  if (capaNotas()) capaNotas().innerHTML = '';
  if (_guia) { _guia.root.remove(); _guia = null; }
  Object.keys(clientTabEstado).forEach(k => delete clientTabEstado[k]);
  Object.keys(_numsPrevios).forEach(k => delete _numsPrevios[k]);
  try { localStorage.removeItem('planet_user'); } catch(e) {}
  $('login-user').value = '';
  $('login-pass').value = '';
  show('screen-login');
}

// Try auto-login
function tryAutoLogin() {
  fillTipoSelects();
  try {
    const saved = localStorage.getItem('planet_user');
    if (saved) {
      currentUser = JSON.parse(saved);
      // Sesiones guardadas antes del sistema de tokens: pedir login de nuevo
      if (!currentUser || !currentUser.token) {
        currentUser = null;
        localStorage.removeItem('planet_user');
        return;
      }
      if (currentUser.team === 'planet') initPlanetView();
      else initClientView();
      arrancarRevision();
    }
  } catch(e) {}
}

// ── CACHE LOCAL: muestra al instante las consultas de la última visita mientras se actualizan ──
let datosMostrados = false;  // ya hay consultas en pantalla (del cache o del servidor)
function cacheKey() { return 'planet_cache_' + (currentUser ? currentUser.usuario : ''); }
function leerCache() {
  try { const raw = localStorage.getItem(cacheKey()); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function guardarCache(lista) {
  try { localStorage.setItem(cacheKey(), JSON.stringify(lista)); } catch (e) {}
}
function borrarCache() {
  try { localStorage.removeItem(cacheKey()); } catch (e) {}
}
function setActualizando(btnId, on) {

// ── BOTONES "CARGANDO": evita que se toque varias veces mientras se guarda ──
function ocupado(btn, texto) {
  if (!btn) return () => {};
  const original = btn.innerHTML;
  btn.classList.add('btn-loading');
  btn.disabled = true;
  if (texto) btn.textContent = texto;
  return () => { btn.classList.remove('btn-loading'); btn.disabled = false; btn.innerHTML = original; };
}
// Bloquea toda la tarjeta mientras se guarda un cambio en ella
function tarjetaOcupada(cardId, on) {
  const el = $(cardId);
  if (el) el.classList.toggle('card-busy', on);
}
function ahoraTexto() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
// Aplica en pantalla lo que el servidor ya confirmó, sin esperar a recargar la lista
function aplicarLocal(lista, id, cambios, mensaje) {

  if (!c) return;
  if (cambios.estado) c.estado = cambios.estado;

}

// ── IMÁGENES ──
const IMG_MAX_POR_MENSAJE = 3;
const IMG_LADO_MAX = 1600;             // se achican antes de subir
const CLIP_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>';
const imgsPendientes = {};             // clave del formulario → [{ b64, mime, preview }]

function elegirImagenes(clave) {
  const input = $('img-input');
  input.value = '';
  input.onchange = () => agregarImagenes(clave, Array.from(input.files || []));
  input.click();
}

async function agregarImagenes(clave, files) {
  const lista = imgsPendientes[clave] = imgsPendientes[clave] || [];
  for (const f of files) {
    if (lista.length >= IMG_MAX_POR_MENSAJE) { toast('Máximo ' + IMG_MAX_POR_MENSAJE + ' fotos por mensaje'); break; }
    if (!/^image\//.test(f.type)) { toast('Solo se pueden adjuntar imágenes'); continue; }
    try { lista.push(await comprimirImagen(f)); }
    catch (e) { toast('No se pudo leer la imagen ' + (f.name || '')); }
  }
  pintarPrevias(clave);
}

// Pegar una imagen (Ctrl + V) en el cuadro de texto la adjunta al mensaje de ese cuadro
function claveDeCampo(el) {
  if (!el || !el.id) return null;
  let m;
  if ((m = el.id.match(/^preply-(\d+)$/))) return 'p' + m[1];
  if ((m = el.id.match(/^reply-(\d+)$/))) return 'c' + m[1];
  if (el.id.indexOf('pnq-') === 0) return 'pnq';
  if (el.id.indexOf('nq-') === 0) return 'nq';
  return null;
}
document.addEventListener('paste', e => {
  const clave = claveDeCampo(document.activeElement);
  if (!clave || !e.clipboardData) return;
  const files = Array.from(e.clipboardData.items || [])
    .filter(it => it.kind === 'file' && /^image\//.test(it.type))
    .map(it => it.getAsFile()).filter(Boolean);
  if (!files.length) return;  // si es texto, se pega normal
  e.preventDefault();
  agregarImagenes(clave, files);
  toast('📎 Imagen adjuntada');
});

// Achica la foto (máx. 1600 px) y la pasa a JPEG para que suba rápido
function comprimirImagen(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, IMG_LADO_MAX / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * k);
      canvas.height = Math.round(img.height * k);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
      resolve({ mime: 'image/jpeg', b64: dataUrl.split(',')[1], preview: dataUrl });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('imagen inválida')); };
    img.src = url;
  });
}

function previasHtml(clave) {
  return (imgsPendientes[clave] || []).map((im, i) => `
    <div class="img-prev"><img src="${im.preview}" alt=""><button type="button" onclick="quitarImagen('${clave}', ${i})" title="Quitar">✕</button></div>`).join('');
}
function pintarPrevias(clave) {
  const el = $('prev-' + clave);
  if (el) el.innerHTML = previasHtml(clave);
}
function quitarImagen(clave, i) {
  (imgsPendientes[clave] || []).splice(i, 1);
  pintarPrevias(clave);
}
function hayImagenes(clave) { return (imgsPendientes[clave] || []).length > 0; }

// Sube las fotos pendientes de un formulario; devuelve los ids o null si falló alguna
async function subirImagenes(clave, btn) {
  const lista = imgsPendientes[clave] || [];
  const ids = [];
  for (let i = 0; i < lista.length; i++) {
    if (btn) btn.textContent = `Subiendo foto ${i + 1}/${lista.length}...`;
    const res = await apiPost({ action: 'subir_imagen', data: lista[i].b64, mime: lista[i].mime });
    if (!res.ok) { toast('Error al subir la foto: ' + (res.error || 'error')); return null; }
    ids.push(res.id);
  }
  return ids;
}

// Las fotos nuevas se guardan en Cloudflare y vienen como URL completa.
// Las de antes de la mudanza son ids de Google Drive y siguen funcionando.
function urlImagen(id, ancho) {
  if (/^https?:\/\//.test(id)) return id;
  return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + ancho;
}
function imagenesMsgHtml(ids) {

  return '<div class="msg-imgs">' + ids.map(id =>
    `<img src="${urlImagen(id, 300)}" loading="lazy" alt="Foto adjunta" onclick="verImagen('${esc(id)}')">`).join('') + '</div>';
}
function verImagen(id) {
  $('lightbox-img').src = urlImagen(id, 1600);
  $('lightbox-link').href = /^https?:\/\//.test(id)
    ? id
    : 'https://drive.google.com/file/d/' + encodeURIComponent(id) + '/view';
  $('lightbox').classList.add('active');
}
function cerrarImagen() {

  $('lightbox-img').removeAttribute('src');
}

// ── CLIENT VIEW ──
function initClientView(prefetched) {
  $('client-name').textContent = currentUser.nombre;
  $('client-org').textContent = currentUser.cliente;
  $('client-avatar').textContent = currentUser.nombre[0];
  $('client-avatar').style.background = avatarColor(currentUser.nombre);
  show('screen-client');
  acomodarIndicadores();
  if (!prefetched) {
    const cached = leerCache();
    if (cached) renderClientData(cached);
  }
  loadClientData(prefetched);
}

async function loadClientData(prefetched) {
  let lista = prefetched;
  if (!lista) {
    if (!datosMostrados) {
      $('client-mis-list').innerHTML = esqueletoHtml(3);
      $('client-planet-list').innerHTML = esqueletoHtml(2);
    }
    setActualizando('client-reload', true);
    const res = await api({ action: 'consultas', cliente: currentUser.cliente });
    setActualizando('client-reload', false);
    if (!currentUser) return;  // cerró sesión mientras cargaba
    if (!res.ok) {
      if (datosMostrados) toast('No se pudo actualizar: ' + (res.error || 'error'));
      else $('client-mis-list').innerHTML = '<div class="empty-state"><p>Error: ' + esc(res.error) + '</p></div>';
      return;
    }
    if (res.ultimo !== undefined) marcaCambios = Number(res.ultimo);
    lista = res.consultas;
  }
  guardarCache(lista);
  renderClientData(lista);
}

function renderClientData(lista) {
  const primeraVez = !datosMostrados;
  datosMostrados = true;
  const consultas = normEstados(lista);
  clientConsultas = consultas;

  // Split: mis consultas (cliente→planet) vs de planet (planet→cliente)
  const mis = consultas.filter(c => c.direccion === 'cliente_a_planet');
  const dePlanet = consultas.filter(c => c.direccion === 'planet_a_cliente');

  // Stats
  const cuenta = (list, g) => list.filter(c => grupoCliente(c.estado) === g).length;
  const esperanMis = cuenta(mis, 'espera');
  $('client-stats').innerHTML = `
    <div class="stat-card"><div class="stat-number" style="color:var(--warning)">${cuenta(mis,'pendiente')}</div><div class="stat-label">Pendientes</div></div>
    <div class="stat-card"><div class="stat-number" style="color:var(--info)">${cuenta(mis,'proceso')}</div><div class="stat-label">En proceso</div></div>
    <div class="stat-card"><div class="stat-number" style="color:var(--wait)">${esperanMis}</div><div class="stat-label">Esperan tu respuesta</div></div>
    <div class="stat-card"><div class="stat-number" style="color:var(--closed)">${cuenta(mis,'cerrado')}</div><div class="stat-label">Cerradas</div></div>
  `;
  rodarNumeros('client-stats');

  // Badges de las pestañas: consultas que esperan respuesta del cliente
  setBadge('client-mis-badge', esperanMis);
  const esperanPlanet = cuenta(dePlanet, 'espera');
  setBadge('client-planet-badge', esperanPlanet);

  $('client-mis-alert').innerHTML = esperanMis > 0 ? alertEsperan(`Planet necesita info tuya en <strong>${esperanMis} consulta${esperanMis>1?'s':''}</strong>`) : '';
  $('client-planet-alert').innerHTML = esperanPlanet > 0 ? alertEsperan(`Planet te hizo <strong>${esperanPlanet} consulta${esperanPlanet>1?'s':''}</strong> que espera${esperanPlanet>1?'n':''} tu respuesta`) : '';

  renderClientList(mis, 'client-mis-list', false, 'No tenés consultas todavía');
  renderClientList(dePlanet, 'client-planet-list', true, 'No hay consultas de Planet');

  if (primeraVez) {
    entrada(tarjetasDe('client-mis-list'));
    entrada(tarjetasDe('client-planet-list'));
  }
  marcarNovedades(consultas, 'card-');

  // Primera vez que el cliente entra (en este dispositivo): guía de cómo funciona el portal
  if (!guiaVista() && !_guia) {
    setTimeout(() => {
      if (currentUser && currentUser.team !== 'planet' && $('screen-client').classList.contains('active')
          && !$('modal-new-query').classList.contains('active') && !guiaVista()) iniciarGuia();
    }, 900);
  }
}
