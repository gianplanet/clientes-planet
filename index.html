// ── ASUNTO: referencia (tracking, dirección, etc.) · cliente · tipo de problema ──
const TIPOS_PROBLEMA = [
  'No entregado',
  'Demora en la entrega',
  'Dirección incorrecta / cambio de dirección',
  'Reprogramar entrega',
  'Paquete dañado',
  'Paquete faltante / extraviado',
  'Otro'
];
function fillTipoSelects() {
  const html = '<option value="">-- Elegí el tipo de problema --</option>' +
    TIPOS_PROBLEMA.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  document.querySelectorAll('.tipo-select').forEach(sel => { sel.innerHTML = html; });
}
// El asunto se arma como: referencia · cliente · tipo de problema
function buildAsunto(referencia, cliente, tipo) {
  // El asunto separa sus partes con " · ", así que si el cliente usó ese símbolo lo cambiamos
  // por un guion. Si no, al copiar se cortaría justo ahí.
  const parts = [String(referencia).replace(/\s*·\s*/g, ' - ')];
  if (cliente) parts.push(cliente);
  parts.push(tipo);
  return parts.join(' · ');
}

// Lo que el cliente escribió (tracking, dirección, etc.): es la primera parte del asunto.
// En las consultas viejas venía como "Tracking 152089", así que le sacamos esa palabra.
// Palabras sueltas que la gente escribe adelante del dato y que Lightdata no entiende
// ("Tracking 152089", "Venta N° 4521"). Se sacan solo del principio.
const ETIQUETAS_REF = /^(?:(?:tracking|seguimiento|env[ií]o|gu[ií]a|venta|pedido|orden|nro\.?|n[°º]|n[úu]m(?:ero)?\.?|#)\s*[:\-–]?\s*)+/i;

// Lo que se copia de una consulta: lo que escribió el cliente, sin esas etiquetas del principio
function refDeAsunto(asunto) {
  const primera = (String(asunto || '').split(' · ')[0] || '').trim();
  const limpio = primera.replace(ETIQUETAS_REF, '').trim();
  return limpio || primera;   // si solo escribió la etiqueta, copiamos lo que haya
}


// Consultas abiertas (desplegadas) — se mantienen al recargar
const openCards = new Set();
function toggleCard(elId) {
  const el = $(elId);
  if (!el) return;
  // Si el usuario seleccionó texto (para copiarlo), no abrimos ni cerramos
  const sel = window.getSelection && window.getSelection();
  if (sel && String(sel).trim().length > 0) return;
  const abrir = !el.classList.contains('open');
  const h0 = el.offsetHeight;
  el.classList.toggle('open', abrir);
  const h1 = el.offsetHeight;
  if (abrir) openCards.add(elId); else openCards.delete(elId);
  if (SIN_MOVIMIENTO) return;
  // Al cerrar, el contenido sigue visible mientras la tarjeta se achica
  if (!abrir) el.classList.add('open');
  const turno = el._turno = (el._turno || 0) + 1;
  el.style.overflow = 'hidden';
  anim(el, { height: [h0 + 'px', h1 + 'px'] }, abrir ? { resorte: [240, 22], mantener: false } : { duracion: 220, mantener: false })
    .then(() => {
      if (el._turno !== turno) return;
      el.style.overflow = '';
      if (!abrir) el.classList.remove('open');
    });
  if (abrir) {
    entrada(el.querySelectorAll('.timeline-item, .thread-msg, .status-actions, .thread-reply-bar, .reply-box'), 'translateY(8px)', 45);
    alFinalDeLosMensajes(el);
  }
  actualizarFab();
}
function openClass(elId) { return openCards.has(elId) ? ' open' : ''; }

// El "+" de nueva consulta se esconde mientras haya una consulta abierta,
// así no queda encima del botón de enviar
function actualizarFab() {
  const fab = document.querySelector('#screen-client .fab');
  if (!fab) return;
  const hayAbierta = !!document.querySelector('#screen-client .consulta-card.open');
  fab.classList.toggle('oculto', hayAbierta);
}

// Al abrir una consulta se muestra lo último que se dijo
function alFinalDeLosMensajes(card) {
  const cont = card && card.querySelector('.msgs-scroll');
  if (!cont) return;
  const alFinal = () => { cont.scrollTop = cont.scrollHeight; };
  alFinal();                       // ya mismo
  requestAnimationFrame(alFinal);  // después de dibujar
  setTimeout(alFinal, 320);        // y al terminar la animación de apertura
}

const COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>';

// Botón para copiar un texto (el asunto, el tracking, etc.)
function botonCopiar(texto, titulo) {
  return `<button type="button" class="copy-btn" data-copiar="${esc(texto)}" title="${esc(titulo || 'Copiar')}">${COPY_ICON}</button>`;
}

async function copiarTexto(texto) {
  try {
    await navigator.clipboard.writeText(texto);
  } catch (e) {
    // Navegadores viejos o sin permiso: copiamos con un campo auxiliar
    const ta = document.createElement('textarea');
    ta.value = texto;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e2) { toast('No se pudo copiar'); }
    document.body.removeChild(ta);
  }
  toast('✓ Copiado');
}

// El botón copiar no debe abrir ni cerrar la tarjeta
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.copy-btn');
  if (!b) return;
  e.preventDefault();
  e.stopPropagation();
  copiarTexto(b.dataset.copiar || '');
}, true);

const CHEVRON = '<svg class="card-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';

// Fecha y hora legible (dd/mm/aaaa hh:mm), aunque la hoja la devuelva como fecha ISO
function fmtFecha(f) {
  if (!f) return '';
  const s = String(f);
  if (/^\d{4}-\d{2}-\d{2}T/.test(s)) {
    const d = new Date(s);
    if (!isNaN(d)) {
      const p = n => String(n).padStart(2, '0');
      return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }
  }
  return s;
}

// ── ESTADOS Y FLUJO ──
// En la hoja se guarda un solo estado; cada lado (Planet / cliente) lo ve con su propio nombre.
//   Abierto            → Planet: Pendiente       · Cliente: Pendiente
//   En proceso         → Planet: En proceso      · Cliente: En proceso
//   Esperando info     → Planet: Esperando info  · Cliente: Esperando tu respuesta
//   Respuesta cliente  → Planet: Pendiente       · Cliente: En proceso
//   Cerrado            → los dos: Cerrado
const ESTADOS_VIEJOS = { 'Esperando': 'Esperando info', 'Respondido': 'Respuesta cliente' };
function normEstados(list) {
  (list || []).forEach(c => { c.estado = ESTADOS_VIEJOS[c.estado] || c.estado || 'Abierto'; });
  return list || [];
}

const GRUPOS = {
  pendiente: { label: 'Pendiente',      cls: 'status-Abierto',        stripe: 'urgent',  color: 'var(--warning)' },
  proceso:   { label: 'En proceso',     cls: 'status-En-proceso',     stripe: 'proceso', color: 'var(--info)' },
  espera:    { label: 'Esperando info', cls: 'status-Esperando-info', stripe: 'espera',  color: 'var(--wait)' },
  cerrado:   { label: 'Cerrado',        cls: 'status-Cerrado',        stripe: 'cerrado', color: 'var(--closed)' }
};
// ── DE A 20 POR VEZ ──
// Con muchos clientes la lista se hace larguísima: mostramos de a 20 y
// el resto se agrega con "Ver más".
const PAGINA = 20;
const visibles = {};        // cuántas tarjetas se muestran en cada lista
const _repintar = {};       // cómo volver a dibujar cada lista
function cuantasVisibles(id) { return visibles[id] || PAGINA; }
function reiniciarPagina(id) { visibles[id] = PAGINA; }
function reiniciarPaginas(ids) { ids.forEach(reiniciarPagina); }
function verMas(id) {
  visibles[id] = cuantasVisibles(id) + PAGINA;
  if (_repintar[id]) _repintar[id]();
}
function botonVerMas(id, restantes) {
  if (restantes <= 0) return '';
  const proximas = Math.min(PAGINA, restantes);
  return `<button class="ver-mas" onclick="verMas('${id}')">Ver ${proximas} más <span>(${restantes} sin mostrar)</span></button>`;
}

// ── BUSCAR Y ORDENAR ──
// Saca tildes y mayúsculas para que "direccion" encuentre "Dirección"
function normalizar(t) {
  return String(t == null ? '' : t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

// ¿La consulta coincide con lo buscado? Busca en el asunto, el cliente, el número y los mensajes.
function coincide(c, q) {
  if (!q) return true;
  const partes = normalizar(q).split(/\s+/).filter(Boolean);
  const texto = normalizar([
    c.asunto, c.cliente, '#' + c.id, c.id, c.nombre_creador, c.atendido_por, c.estado,
    (c.mensajes || []).map(m => (m.nombre || '') + ' ' + (m.texto || '')).join(' ')
  ].join(' '));
  return partes.every(p => texto.indexOf(p) >= 0);
}

// Fecha de la última actividad: el último mensaje, o la fecha de creación
function fechaMs(f) {
  const s = String(f || '');
  const m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})(?:[ ,]+(\d{1,2}):(\d{2}))?/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0)).getTime();
  const d = new Date(s);
  return isNaN(d) ? 0 : d.getTime();
}
function ultimaActividad(c) {
  const msgs = c.mensajes || [];
  const fechas = [fechaMs(c.fecha)].concat(msgs.map(m => fechaMs(m.fecha)));
  return Math.max.apply(null, fechas.concat([0]));
}
// Ordena por última actividad; a igualdad, por número de consulta
function ordenar(lista) {
  const signo = ordenNuevasPrimero ? -1 : 1;
  return lista.slice().sort((a, b) => {
    const d = ultimaActividad(a) - ultimaActividad(b);
    return signo * (d !== 0 ? d : (Number(a.id) - Number(b.id)));
  });
}

// ── Buscador de Planet ──

// Botón para dar vuelta el orden
function chipOrden() {
  return `<button class="client-chip orden-chip" onclick="toggleOrden()" title="Cambiar el orden: por última actividad">${textoOrden()}</button>`;
}
function textoOrden() { return ordenNuevasPrimero ? '↓ Más recientes' : '↑ Más antiguas'; }
function toggleOrden() {
  ordenNuevasPrimero = !ordenNuevasPrimero;
  try { localStorage.setItem('planet_orden', ordenNuevasPrimero ? '1' : '0'); } catch (e) {}
  document.querySelectorAll('.orden-chip').forEach(b => { b.textContent = textoOrden(); });

  else Object.keys(_listasCliente).forEach(pintarListaCliente);

try { ordenNuevasPrimero = localStorage.getItem('planet_orden') !== '0'; } catch (e) {}

function grupoPlanet(estado) {
  if (estado === 'Abierto' || estado === 'Respuesta cliente') return 'pendiente';
  if (estado === 'En proceso') return 'proceso';
  if (estado === 'Esperando info') return 'espera';
  if (estado === 'Cerrado') return 'cerrado';
  return 'pendiente';
}
function grupoCliente(estado) {
  if (estado === 'Abierto') return 'pendiente';
  if (estado === 'En proceso' || estado === 'Respuesta cliente') return 'proceso';
  if (estado === 'Esperando info') return 'espera';
  if (estado === 'Cerrado') return 'cerrado';
  return 'pendiente';
}
function badgeEstado(grupo, paraCliente) {
  const g = GRUPOS[grupo];
  const label = (paraCliente && grupo === 'espera') ? 'Esperando tu respuesta' : g.label;
  return `<span class="ticket-status ${g.cls}">${esc(label)}</span>`;
}
function estadoLabel(estado) { return GRUPOS[grupoPlanet(estado)].label; }

// Solapas de estado del cliente (como las de Planet). Al entrar se abre la primera que tenga
// consultas: Esperan tu respuesta → Pendiente → En proceso. Las cerradas quedan en su solapa.
const clientTabEstado = {};   // lista → 'espera' | 'pendiente' | 'proceso' | 'cerrado' | 'Todos'
const _listasCliente = {};
const SOLAPAS_CLIENTE = [
  { g: 'pendiente', icono: '⏳', label: 'Pendiente' },
  { g: 'proceso',   icono: '🔄', label: 'En proceso' },
  { g: 'espera',    icono: '💬', label: 'Esperan tu respuesta' },
  { g: 'cerrado',   icono: '✓',  label: 'Cerradas' }
];
function solapaInicial(consultas) {
  const hay = g => consultas.some(c => grupoCliente(c.estado) === g);
  return ['espera', 'pendiente', 'proceso'].find(hay) || 'cerrado';
}
function renderClientList(consultas, containerId, isPlanetQuery, vacio) {
  _listasCliente[containerId] = { consultas, isPlanetQuery };
  if (consultas.length === 0) {
    $(containerId).innerHTML = `<div class="empty-state"><p>${vacio}</p></div>`;
    return;
  }
  const vista = clientTabEstado[containerId] || (clientTabEstado[containerId] = solapaInicial(consultas));
  const n = g => consultas.filter(c => grupoCliente(c.estado) === g).length;
  const chips = SOLAPAS_CLIENTE.map(t => {
    const act = vista === t.g, col = GRUPOS[t.g].color;
    return `<button class="client-chip ${act ? 'active' : ''}" data-v="${t.g}" onclick="clientEstadoTab('${containerId}','${t.g}',this)" style="${act ? '' : 'border-color:' + col + ';color:' + col + ';'}">${t.icono} ${t.label} <span class="cnt">${n(t.g)}</span></button>`;
  }).join('') +
    `<button class="client-chip ${vista === 'Todos' ? 'active' : ''}" data-v="Todos" onclick="clientEstadoTab('${containerId}','Todos',this)">Todas <span class="cnt">${consultas.length}</span></button>` + chipOrden();
  $(containerId).innerHTML = `<div class="client-filter estado-chips">${chips}</div><div class="estado-lista"></div>`;
  pintarListaCliente(containerId);
}

function pintarListaCliente(containerId) {
  const guardado = _listasCliente[containerId];
  if (!guardado) return;
  const isPlanetQuery = guardado.isPlanetQuery;
  const consultas = busquedaCliente ? guardado.consultas.filter(c => coincide(c, busquedaCliente)) : guardado.consultas;
  const vista = clientTabEstado[containerId];
  const cont = $(containerId).querySelector('.estado-lista');
  if (!cont) return;
  // Buscando: mostramos todas las coincidencias, sin separar por estado
  _repintar[containerId] = () => pintarListaCliente(containerId);
  const tope = cuantasVisibles(containerId);
  if (busquedaCliente) {
    actualizarFab();
    const halladas = ordenar(consultas);
    cont.innerHTML = halladas.length
      ? `<div class="search-info">${halladas.length} resultado${halladas.length === 1 ? '' : 's'}</div>` +
        halladas.slice(0, tope).map(c => renderClientConsultaCard(c, grupoCliente(c.estado) === 'cerrado', isPlanetQuery)).join('') +
        botonVerMas(containerId, halladas.length - Math.min(tope, halladas.length))
      : `<div class="empty-state"><p>No encontramos consultas con “${esc(busquedaCliente)}”</p></div>`;
    return;
  }
  if (vista !== 'Todos') {
    const lista = ordenar(consultas.filter(c => grupoCliente(c.estado) === vista));
    const t = SOLAPAS_CLIENTE.find(x => x.g === vista);
    cont.innerHTML = lista.length
      ? lista.slice(0, tope).map(c => renderClientConsultaCard(c, false, isPlanetQuery)).join('') +
        botonVerMas(containerId, lista.length - Math.min(tope, lista.length))
      : `<div class="empty-state"><p>No hay consultas en “${t ? t.label : vista}”</p></div>`;
    actualizarFab();
    return;
  }
  // Todas: agrupadas, con las cerradas al final
  let html = '', mostradas = 0;
  const seccion = (titulo, list, color, dimmed) => {
    if (list.length === 0 || mostradas >= tope) return;
    const parte = list.slice(0, tope - mostradas);
    mostradas += parte.length;
    const de = parte.length < list.length ? ` (${parte.length} de ${list.length})` : '';
    html += `<div class="section-label" style="${html ? 'margin-top:20px;' : ''}${color ? 'color:' + color : ''}">${titulo}${de}</div>`;
    parte.forEach(c => { html += renderClientConsultaCard(c, dimmed, isPlanetQuery); });
  };
  const de = g => ordenar(consultas.filter(c => grupoCliente(c.estado) === g));
  seccion('Esperan tu respuesta', de('espera'), 'var(--wait)', false);
  seccion('Pendientes', de('pendiente'), '', false);
  seccion('En proceso', de('proceso'), '', false);
  seccion('Cerradas', de('cerrado'), '', true);
  cont.innerHTML = html + botonVerMas(containerId, consultas.length - mostradas);
  actualizarFab();
}

function clientEstadoTab(containerId, vista, btn) {
  if (clientTabEstado[containerId] === vista) return;
  reiniciarPagina(containerId);
  const orden = ['pendiente', 'proceso', 'espera', 'cerrado', 'Todos'];
  const dir = orden.indexOf(vista) > orden.indexOf(clientTabEstado[containerId]) ? 1 : -1;
  clientTabEstado[containerId] = vista;
  btn.closest('.client-filter').querySelectorAll('.client-chip').forEach(b => {
    const g = b.dataset.v;
    if (!g) return;              // el botón de orden no es una solapa
    const act = b === btn;
    b.classList.toggle('active', act);
    b.style.cssText = (act || g === 'Todos' || !GRUPOS[g]) ? '' : 'border-color:' + GRUPOS[g].color + ';color:' + GRUPOS[g].color + ';';
  });
  pintarListaCliente(containerId);
  entrada($(containerId).querySelector('.estado-lista').children, `translateX(${20 * dir}px)`, 35);
}
// Lo que se anima al cargar: las tarjetas, no la barra de solapas
function tarjetasDe(containerId) {
  const l = $(containerId).querySelector('.estado-lista');
  return (l || $(containerId)).children;
}

function renderClientConsultaCard(c, dimmed, isPlanetQuery) {
  const msgs = c.mensajes || [];
  const grupo = grupoCliente(c.estado);
  const canReply = grupo !== 'cerrado';
  const borderStyle = (isPlanetQuery && grupo !== 'espera') ? 'border-left: 3px solid var(--purple);' : '';
  const dimStyle = dimmed ? 'opacity:0.7;' : '';

  let timelineHtml = '';
  msgs.forEach(m => {
    timelineHtml += `
      <div class="timeline-item">
        <span class="timeline-who">${esc(m.nombre)}</span>
        <span class="timeline-time">${esc(fmtFecha(m.fecha))}</span>
        ${m.texto ? `<p>${esc(m.texto)}</p>` : ''}
        ${imagenesMsgHtml(m.imagenes)}
      </div>`;
  });

  const replyHtml = canReply ? `
    <div class="img-previews reply-previews" id="prev-c${c.id}">${previasHtml('c' + c.id)}</div>
    <div class="reply-box">
      <button type="button" class="attach-btn" onclick="elegirImagenes('c${c.id}')" title="Adjuntar fotos">${CLIP_ICON}</button>
      <input type="text" placeholder="${grupo === 'espera' ? 'Escribí la info que pide Planet...' : 'Responder...'}" id="reply-${c.id}" onkeydown="if(event.key==='Enter')clientReply(${c.id}, this.nextElementSibling)">
      <button class="reply-send" onclick="clientReply(${c.id}, this)" title="Enviar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>` : '';

  return `
    <div class="consulta-card${grupo === 'espera' ? ' needs-reply' : ''}${openClass('card-' + c.id)}" style="${borderStyle}${dimStyle}" id="card-${c.id}">
      <div class="consulta-header card-summary" onclick="toggleCard('card-${c.id}')">
        <div class="card-top">
          ${badgeEstado(grupo, true)}
          <span class="card-date">${esc(fmtFecha(c.fecha))}</span>
          ${botonCopiar(refDeAsunto(c.asunto), 'Copiar el tracking / referencia')}
          ${CHEVRON}
        </div>
        <div class="card-asunto">${esc(c.asunto)}</div>
      </div>
      <div class="consulta-detail"><div class="msgs-scroll" id="msgs-c${c.id}">${timelineHtml}</div></div>
      ${!canReply && msgs.length > 0 ? `<div class="consulta-detail" style="padding-top:0;font-size:12px;color:var(--text-muted);font-style:italic;">📋 ${msgs.length} mensaje${msgs.length>1?'s':''} en historial</div>` : ''}
      ${replyHtml}
    </div>`;
}

async function clientReply(id, btn) {
  const input = $('reply-' + id);
  const texto = input.value.trim();
  const clave = 'c' + id;
  if (input.disabled) return;
  if (!texto && !hayImagenes(clave)) { sacudir(input); input.focus(); return; }
  input.disabled = true;
  await volarAvion(btn);
  const listo = ocupado(btn);
  tarjetaOcupada('card-' + id, true);

  let imagenes = [];
  if (hayImagenes(clave)) {
    imagenes = await subirImagenes(clave, null);
    if (!imagenes) { tarjetaOcupada('card-' + id, false); listo(); input.disabled = false; return; }
  }
  const params = { action: 'responder', id: id, texto: texto };
  if (imagenes.length) params.imagenes = JSON.stringify(imagenes);
  const res = await api(params);

  tarjetaOcupada('card-' + id, false);
  listo();
  input.disabled = false;
  if (res.ok) {
    input.value = '';
    toast('✓ Mensaje enviado');
    // Mismo cambio que hace el servidor: si Planet ya la estaba viendo, vuelve a Planet como pendiente
    const c = clientConsultas.find(x => String(x.id) === String(id));
    const cambios = (c && c.estado !== 'Abierto') ? { estado: 'Respuesta cliente' } : {};
    delete imgsPendientes[clave];
    aplicarLocal(clientConsultas, id, cambios, { autor: currentUser.usuario, nombre: currentUser.nombre, fecha: ahoraTexto(), texto, imagenes });
    renderClientData(clientConsultas);
    loadClientData();
  } else {
    toast('Error: ' + (res.error || 'No se pudo enviar') + ' — tocá ↻ antes de reenviar');
  }
}

}
function closeClientNewQuery() {
  const ov = $('modal-new-query'), cont = ov.querySelector('.modal-content');
  if (!ov.classList.contains('active') || ov._cerrando) return;
  ov._cerrando = true;
  Promise.all([
    anim(cont, { transform: ['translateY(0)', 'translateY(100%)'] }, { duracion: 240, easing: 'cubic-bezier(.4,0,1,1)', mantener: false, fill: 'forwards' }),
    anim(ov, { opacity: [1, 0] }, { duracion: 240, mantener: false, fill: 'forwards' })
  ]).then(() => {
    ov.classList.remove('active');
    ov._cerrando = false;
    [ov, cont].forEach(e => e.getAnimations().forEach(a => a.cancel()));
  });
}

async function sendClientNewQuery() {
  const referencia = $('nq-ref').value.trim();
  const tipo = $('nq-tipo').value;
  const mensaje = $('nq-mensaje').value.trim();
  if (!referencia || !tipo || !mensaje) {
    toast('Completá el tracking o referencia, el tipo de problema y el mensaje');
    sacudirVacios(['nq-ref', 'nq-tipo', 'nq-mensaje']);
    return;
  }
  const asunto = buildAsunto(referencia, currentUser.cliente, tipo);

  if ($('nq-send').disabled) return;
  const listoNq = ocupado($('nq-send'), 'Enviando...');
  toast.cargando(hayImagenes('nq') ? 'Subiendo fotos…' : 'Enviando consulta…');

  let imagenesNq = [];
  if (hayImagenes('nq')) {
    imagenesNq = await subirImagenes('nq', $('nq-send'));
    if (!imagenesNq) { listoNq(); return; }
  }

  const res = await api({
    imagenes: JSON.stringify(imagenesNq),
    action: 'nueva_consulta',
    tipo: tipo,
    asunto: asunto,
    cliente: currentUser.cliente,
    direccion: 'cliente_a_planet',
    creado_por: currentUser.usuario,
    nombre_creador: currentUser.nombre,
    mensaje: mensaje
  });

  listoNq();

  if (res.ok) {
    delete imgsPendientes['nq'];
    pintarPrevias('nq');
    closeClientNewQuery();
    toast('✓ Consulta #' + res.id + ' creada', { desc: 'Planet ya la puede ver. Te avisamos acá cuando respondan.' });
    loadClientData();
  } else {
    toast('Error: ' + (res.error || 'No se pudo crear'));
  }
}

function clientSubtab(btn, id) {
  const barra = btn.closest('.subtab-bar');
  const tabs = Array.from(barra.querySelectorAll('.subtab'));
  const antes = tabs.findIndex(b => b.classList.contains('active'));
  const ahora = tabs.indexOf(btn);
  tabs.forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  moverIndicador(barra, btn, true);
  document.querySelectorAll('#screen-client .client-sub').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  acomodarIndicadores();
  if (antes !== ahora) {
    const dir = ahora > antes ? 1 : -1;
    anim($(id), { opacity: [0, 1], transform: [`translateX(${24 * dir}px)`, 'none'] }, { resorte: [280, 26], mantener: false });
  }
}

// ═══ PLANET VIEW ═══
function initPlanetView(prefetched) {
  $('planet-name').textContent = currentUser.nombre;
  $('planet-role').textContent = 'Planet · ' + (currentUser.role === 'admin' ? 'Admin' : 'Usuario');
  $('planet-avatar').textContent = currentUser.nombre[0];
  $('planet-avatar').style.background = avatarColor(currentUser.nombre);
  // Show admin section if user is admin
  if (currentUser.role === 'admin') {
    $('admin-sep').style.display = '';
    $('admin-clientes-btn').style.display = '';
    $('admin-btn').style.display = '';
  }
  show('screen-planet');
  acomodarIndicadores();
  if (!prefetched && !notasData.length) {
    try { const n = JSON.parse(localStorage.getItem(notasKey()) || 'null'); if (n) setNotas(n); } catch (e) {}
  }
  pintarNotas();
  if (!prefetched) {
    const cached = leerCache();
    if (cached) renderPlanetData(cached);
  }
  loadPlanetData(prefetched);
}

async function loadPlanetData(prefetched) {
  let lista = prefetched;
  if (!lista) {
    if (!datosMostrados) {
      $('planet-consultas-list').innerHTML = esqueletoHtml(4);
      $('planet-enviadas-list').innerHTML = esqueletoHtml(3);
    }
    setActualizando('planet-reload', true);
    const res = await api({ action: 'consultas' });
    setActualizando('planet-reload', false);
    if (!currentUser) return;  // cerró sesión mientras cargaba
    if (!res.ok) {
      if (datosMostrados) toast('No se pudo actualizar: ' + (res.error || 'error'));
      else $('planet-consultas-list').innerHTML = '<div class="empty-state"><p>Error: ' + esc(res.error) + '</p></div>';
      return;
    }
    if (res.notas) setNotas(res.notas);
    if (res.ultimo !== undefined) marcaCambios = Number(res.ultimo);
    lista = res.consultas;
  }
  guardarCache(lista);
  renderPlanetData(lista);
}

function renderPlanetData(lista) {
  const primeraVez = !datosMostrados;
  datosMostrados = true;
  allConsultas = normEstados(lista);

  // Unique clients from consultas (for filter chips)
  allClientes = [...new Set(allConsultas.map(c => c.cliente))].filter(Boolean).sort();

  // Populate client selector for new query — use registered clients if available, else from consultas
  const clienteOptions = allClientesData.length > 0 ? allClientesData.map(c => c.nombre).sort() : allClientes;
  $('pnq-cliente').innerHTML = clienteOptions.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');

  // Also preload registered clients for the dropdown
  if (allClientesData.length === 0) preloadClients();

  // Recibidas = cliente_a_planet
  const recibidas = allConsultas.filter(c => c.direccion === 'cliente_a_planet');
  const enviadas = allConsultas.filter(c => c.direccion === 'planet_a_cliente');

  // Stats (recibidas)
  const cuenta = (list, g) => list.filter(c => grupoPlanet(c.estado) === g).length;
  const pendientes = cuenta(recibidas, 'pendiente');
  const enProceso = cuenta(recibidas, 'proceso');

  $('planet-stats').innerHTML = ['pendiente','proceso','espera','cerrado'].map(g => `
    <div class="stat-card"><div class="stat-number" style="color:${GRUPOS[g].color}">${cuenta(recibidas, g)}</div><div class="stat-label">${g === 'pendiente' ? 'Pendientes' : g === 'cerrado' ? 'Cerradas' : GRUPOS[g].label}</div></div>`).join('');
  rodarNumeros('planet-stats');

  // Sidebar badges: lo que requiere atención de Planet
  ponerContador($('sb-consultas'), pendientes + enProceso);
  ponerContador($('sb-enviadas'), cuenta(enviadas, 'pendiente'));

  // Alert
  if (pendientes > 0) {
    $('planet-alert').innerHTML = `
      <div class="alert-banner alert-danger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span><strong>${pendientes} consulta${pendientes>1?'s':''} pendiente${pendientes>1?'s':''}</strong> sin atender</span>
      </div>`;
  } else {
    $('planet-alert').innerHTML = '';
  }

  // Estado filter chips (Todos al final)
  const chip = (g, icono) => {
    const act = planetEstadoFilter === g;
    return `<button class="client-chip ${act?'active':''}" onclick="setPlanetEstadoFilter('${g}',this)" style="${act?'':'border-color:'+GRUPOS[g].color+';color:'+GRUPOS[g].color+';'}">${icono} ${GRUPOS[g].label}</button>`;
  };
  $('planet-estado-filter').innerHTML = `
    ${chip('pendiente','⏳')}
    ${chip('proceso','🔄')}
    ${chip('espera','💬')}
    ${chip('cerrado','✓')}
    <button class="client-chip ${planetEstadoFilter==='Todos'?'active':''}" onclick="setPlanetEstadoFilter('Todos',this)">Todos</button>
    ${chipOrden()}
  `;

  // Client filter chips — only show clients that have consultas
  const clientesConConsultas = [...new Set(recibidas.map(c => c.cliente))].sort();
  // Hasta 6 clientes van como botones; con más, un desplegable (si no, la pantalla se llena de botones)
  if (clientesConConsultas.length > 6) {
    const cuenta = n => recibidas.filter(c => c.cliente === n).length;
    $('planet-filter').innerHTML = `
      <select class="cliente-select" onchange="elegirCliente(this.value)">
        <option value="Todos"${planetFilter === 'Todos' ? ' selected' : ''}>Todos los clientes (${recibidas.length})</option>
        ${clientesConConsultas.map(n => `<option value="${esc(n)}"${planetFilter === n ? ' selected' : ''}>${esc(n)} (${cuenta(n)})</option>`).join('')}
      </select>`;
  } else {
    $('planet-filter').innerHTML = `
      ${clientesConConsultas.map(c => `<button class="client-chip ${planetFilter===c?'active':''}" onclick="setPlanetFilter('${esc(c)}',this)">${esc(c)}</button>`).join('')}
      <button class="client-chip ${planetFilter==='Todos'?'active':''}" onclick="setPlanetFilter('Todos',this)">Todos</button>
    `;
  }

  renderPlanetConsultas(recibidas);
  renderPlanetEnviadas(enviadas);

  if (primeraVez) {
    entrada($('planet-consultas-list').children);
    entrada($('planet-enviadas-list').children);
  }
  marcarNovedades(allConsultas, 'tcard-');
}

// Elegir cliente desde el desplegable
function elegirCliente(nombre) {
  planetFilter = nombre;
  reiniciarPagina('planet-consultas-list');
  renderPlanetConsultas(allConsultas.filter(c => c.direccion === 'cliente_a_planet'));

function setPlanetEstadoFilter(f, btn) {

function renderPlanetConsultas(consultas) {
  let filtered = consultas;
  if (planetFilter !== 'Todos') {
    filtered = filtered.filter(c => c.cliente === planetFilter);
  }
  if (planetEstadoFilter !== 'Todos') {
    filtered = filtered.filter(c => grupoPlanet(c.estado) === planetEstadoFilter);
  }
  if (busquedaPlanet) filtered = filtered.filter(c => coincide(c, busquedaPlanet));

  const info = $('planet-search-info');
  if (info) {
    info.hidden = !busquedaPlanet;
    info.textContent = busquedaPlanet
      ? `${filtered.length} resultado${filtered.length === 1 ? '' : 's'} para “${busquedaPlanet}”`
      : '';
  }

  if (filtered.length === 0) {
    const conFiltro = planetFilter !== 'Todos' || planetEstadoFilter !== 'Todos' || busquedaPlanet;
    $('planet-consultas-list').innerHTML = '<div class="empty-state"><p>No hay consultas' + (conFiltro ? ' con ese filtro' : '') + '</p></div>';
    return;
  }
  _repintar['planet-consultas-list'] = () => renderPlanetConsultas(consultas);
  $('planet-consultas-list').innerHTML = renderPlanetGrupos(filtered, false, 'planet-consultas-list');
}

function renderPlanetEnviadas(consultas) {
  if (busquedaPlanet) consultas = consultas.filter(c => coincide(c, busquedaPlanet));
  if (consultas.length === 0) {
    $('planet-enviadas-list').innerHTML = '<div class="empty-state"><p>No hay consultas enviadas</p></div>';
    return;
  }
  _repintar['planet-enviadas-list'] = () => renderPlanetEnviadas(consultas);
  $('planet-enviadas-list').innerHTML = renderPlanetGrupos(consultas, true, 'planet-enviadas-list');
}

// Lista agrupada: Pendientes → En proceso → Esperando info → Cerradas
function renderPlanetGrupos(consultas, isPlanetQuery, contId) {
  const titulos = {
    pendiente: 'Pendientes — requieren atención',
    proceso: 'En proceso',
    espera: isPlanetQuery ? 'Esperando respuesta del cliente' : 'Esperando info del cliente',
    cerrado: 'Cerradas'
  };
  const tope = cuantasVisibles(contId);
  let mostradas = 0, html = '';
  ['pendiente','proceso','espera','cerrado'].forEach(g => {
    const list = ordenar(consultas.filter(c => grupoPlanet(c.estado) === g));
    if (list.length === 0 || mostradas >= tope) return;
    const visibles = list.slice(0, tope - mostradas);
    mostradas += visibles.length;
    const color = g === 'pendiente' ? 'var(--danger)' : g === 'cerrado' ? '' : GRUPOS[g].color;
    const de = visibles.length < list.length ? ` (${visibles.length} de ${list.length})` : '';
    html += `<div class="section-label" style="${html ? 'margin-top:20px;' : ''}${color ? 'color:' + color : ''}">${titulos[g]}${de}</div>`;
    visibles.forEach(c => html += renderTicketCard(c, isPlanetQuery));
  });
  return html + botonVerMas(contId, consultas.length - mostradas);
}

function renderTicketCard(c, isPlanetQuery) {
  const msgs = c.mensajes || [];
  const grupo = grupoPlanet(c.estado);
  const stripeClass = GRUPOS[grupo].stripe;
  const dirTag = c.direccion === 'cliente_a_planet'
    ? '<span class="ticket-direction-tag dir-incoming">← Recibida</span>'
    : '<span class="ticket-direction-tag dir-outgoing">→ Enviada</span>';

  // Thread — always show history, reply bar only if not closed
  let threadHtml = '';
  if (msgs.length > 0) {
    threadHtml += '<div class="ticket-thread"><div class="msgs-scroll" id="msgs-p' + c.id + '">';
    msgs.forEach(m => {
      const col = avatarColor(m.nombre || m.autor);
      threadHtml += `
        <div class="thread-msg">
          <div class="thread-avatar" style="background:${col}">${esc((m.nombre||m.autor)[0])}</div>
          <div class="thread-content">
            <div class="thread-meta">
              <span class="thread-name">${esc(m.nombre||m.autor)}</span>
              <span class="thread-time">${esc(fmtFecha(m.fecha))}</span>
            </div>
            ${m.texto ? `<div class="thread-text">${esc(m.texto)}</div>` : ''}
            ${imagenesMsgHtml(m.imagenes)}
          </div>
        </div>`;
    });
    threadHtml += '</div>';   // cierra .msgs-scroll
    // Reply bar only if not closed
    if (grupo !== 'cerrado') {
      threadHtml += `
        <div class="img-previews thread-previews" id="prev-p${c.id}">${previasHtml('p' + c.id)}</div>
        <div class="thread-reply-bar">
          <button type="button" class="attach-btn" onclick="elegirImagenes('p${c.id}')" title="Adjuntar fotos">${CLIP_ICON}</button>
          <input class="thread-reply-input" placeholder="Responder... (podés pegar fotos con Ctrl+V)" id="preply-${c.id}" onkeydown="if(event.key==='Enter')planetReply(${c.id}, false, this.nextElementSibling)">
          <button class="thread-reply-btn" onclick="planetReply(${c.id}, false, this)" title="Envía el mensaje; la consulta queda En proceso">Enviar</button>
          <button class="thread-reply-btn btn-wait" onclick="planetReply(${c.id}, true, this)" title="Envía el mensaje y pasa la consulta a Esperando info">Enviar y pedir info</button>
        </div>`;
    }
    threadHtml += '</div>';
  }

  // Action buttons
  let actionsHtml = '';
  if (grupo === 'pendiente') {
    actionsHtml = `
      <div class="status-actions">
        <button class="status-btn btn-proceso" onclick="changeStatus(${c.id},'En proceso',this)">Tomar → En proceso</button>
        <button class="status-btn btn-cerrar" onclick="changeStatus(${c.id},'Cerrado',this)">Cerrar</button>
      </div>`;
  } else if (grupo === 'proceso') {
    actionsHtml = `
      <div class="status-actions">
        <button class="status-btn btn-cerrar" onclick="changeStatus(${c.id},'Cerrado',this)">Cerrar</button>
      </div>`;
  } else if (grupo === 'espera') {
    actionsHtml = `
      <div class="status-actions">
        <button class="status-btn btn-proceso" onclick="changeStatus(${c.id},'En proceso',this)">Retomar → En proceso</button>
        <button class="status-btn btn-cerrar" onclick="changeStatus(${c.id},'Cerrado',this)">Cerrar</button>
      </div>`;
  }

  const cardId = 'tcard-' + c.id;
  return `
    <div class="ticket-card${openClass(cardId)}" id="${cardId}">
      <div class="ticket-stripe ${stripeClass}"></div>
      <div class="ticket-body">
        <div class="card-summary" onclick="toggleCard('${cardId}')">
          <div class="card-top">
            ${badgeEstado(grupo, false)}
            <span class="card-date">${esc(fmtFecha(c.fecha))}</span>
            ${c.estado === 'Respuesta cliente' ? '<span class="tag-respondio">💬 Respondió el cliente</span>' : ''}
            <span class="ticket-client-tag tag-${esc(c.cliente)}">${esc(c.cliente)}</span>
            ${botonCopiar(refDeAsunto(c.asunto), 'Copiar el tracking / referencia')}
            ${CHEVRON}
          </div>
          <div class="card-asunto">${esc(c.asunto)}</div>
        </div>
        <div class="ticket-details">
          <div class="ticket-footer" style="margin-bottom:6px;">
            <span class="ticket-tracking">#${c.id}</span>
            ${dirTag}
            <span class="ticket-who">${c.creado_por ? 'Crea: ' + esc(c.nombre_creador) : ''}${c.atendido_por ? ' · Atiende: ' + esc(c.atendido_por) : ''}</span>
          </div>
          ${threadHtml}
          ${actionsHtml}
        </div>
      </div>
    </div>`;
}

async function planetReply(id, pedirInfo, btn) {
  const input = $('preply-' + id);
  const texto = input.value.trim();
  const clave = 'p' + id;
  if (input.disabled) return;
  if (!texto && !hayImagenes(clave)) { toast(pedirInfo ? 'Escribí qué info necesitás del cliente' : 'Escribí un mensaje'); sacudir(input); input.focus(); return; }
  const cardId = 'tcard-' + id;
  input.disabled = true;
  const listo = ocupado(btn, 'Enviando...');
  tarjetaOcupada(cardId, true);

  let imagenes = [];
  if (hayImagenes(clave)) {
    imagenes = await subirImagenes(clave, btn);
    if (!imagenes) { tarjetaOcupada(cardId, false); listo(); input.disabled = false; return; }
    if (btn) btn.textContent = 'Enviando...';
  }
  const params = { action: 'responder', id: id, texto: texto };
  if (imagenes.length) params.imagenes = JSON.stringify(imagenes);
  if (pedirInfo) params.esperar_info = '1';
  const res = await api(params);

  tarjetaOcupada(cardId, false);
  listo();
  input.disabled = false;

  if (res.ok) {
    input.value = '';
    toast(pedirInfo ? '✓ Mensaje enviado · Esperando info del cliente' : '✓ Mensaje enviado');
    // Mismo cambio que hace el servidor
    const c = allConsultas.find(x => String(x.id) === String(id));
    let estado = null;
    if (pedirInfo) estado = 'Esperando info';
    else if (c && (c.estado === 'Abierto' || c.estado === 'Respuesta cliente')) estado = 'En proceso';
    delete imgsPendientes[clave];
    aplicarLocal(allConsultas, id, estado ? { estado, atendido_por: currentUser.nombre } : {},
      { autor: currentUser.usuario, nombre: currentUser.nombre, fecha: ahoraTexto(), texto, imagenes });
    renderPlanetData(allConsultas);
    loadPlanetData();
  } else {
    toast('Error: ' + (res.error || 'No se pudo enviar') + ' — tocá ↻ antes de reenviar');
  }
}

async function changeStatus(id, estado, btn) {
  const cardId = 'tcard-' + id;
  const listo = ocupado(btn, estado === 'Cerrado' ? 'Cerrando...' : 'Guardando...');
  tarjetaOcupada(cardId, true);

  const res = await api({ action: 'cambiar_estado', id: id, estado: estado, atendido_por: currentUser.nombre });

  tarjetaOcupada(cardId, false);
  listo();
  if (res.ok) {
    toast('✓ Estado cambiado a ' + estadoLabel(estado));
    aplicarLocal(allConsultas, id, { estado, atendido_por: currentUser.nombre });
    renderPlanetData(allConsultas);
    loadPlanetData();
  } else {
    toast('Error: ' + (res.error || 'No se pudo cambiar'));
  }
}

async function sendPlanetNewQuery() {
  const cliente = $('pnq-cliente').value;
  const referencia = $('pnq-ref').value.trim();
  const tipo = $('pnq-tipo').value;
  const mensaje = $('pnq-mensaje').value.trim();
  if (!referencia || !tipo || !mensaje || !cliente) {
    toast('Completá el tracking o referencia, el tipo de problema y el mensaje');
    sacudirVacios(['pnq-cliente', 'pnq-ref', 'pnq-tipo', 'pnq-mensaje']);
    return;
  }
  const asunto = buildAsunto(referencia, cliente, tipo);

  if ($('pnq-send').disabled) return;
  const listoPnq = ocupado($('pnq-send'), 'Enviando...');
  toast.cargando(hayImagenes('pnq') ? 'Subiendo fotos…' : 'Enviando consulta…');

  let imagenesPnq = [];
  if (hayImagenes('pnq')) {
    imagenesPnq = await subirImagenes('pnq', $('pnq-send'));
    if (!imagenesPnq) { listoPnq(); return; }
  }

  const res = await api({
    imagenes: JSON.stringify(imagenesPnq),
    action: 'nueva_consulta',
    tipo: tipo,
    asunto: asunto,
    cliente: cliente,
    direccion: 'planet_a_cliente',
    creado_por: currentUser.usuario,
    nombre_creador: currentUser.nombre,
    mensaje: mensaje
  });

  listoPnq();

  if (res.ok) {
    $('pnq-ref').value = '';
    $('pnq-tipo').value = '';
    $('pnq-mensaje').value = '';
    delete imgsPendientes['pnq'];
    pintarPrevias('pnq');
    toast('✓ Consulta #' + res.id + ' enviada', { desc: cliente + ' la va a ver en su portal.' });
    planetNav(document.querySelector('.sidebar-item'), 'planet-enviadas');
    loadPlanetData();
  } else {
    toast('Error: ' + (res.error || 'No se pudo enviar'));
  }
}

function planetNav(btn, id) {
  const yaEstaba = $(id).classList.contains('active');
  document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  moverIndicador(btn.closest('.sidebar'), btn, true);
  document.querySelectorAll('#screen-planet .planet-sub').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  if (!yaEstaba) anim($(id), { opacity: [0, 1], transform: ['translateY(8px)', 'none'] }, { duracion: 320, mantener: false });
  if (id === 'planet-usuarios') { loadUsers(); preloadClients(); }
  if (id === 'planet-clientes') loadClients();
  if (id === 'planet-metricas') cargarMetricas();
}

// ═══ MÉTRICAS ═══
// Todos los tiempos son en HORAS CORRIDAS: el reloj corre igual de noche,
// fines de semana y feriados.
let metPeriodo = 30;   // días; 0 = desde siempre

// Convierte milisegundos en algo legible: "2 h 15 min", "3 d 4 h"
function fmtDuracion(ms) {
  if (ms === null || ms === undefined) return '—';
  const min = Math.round(ms / 60000);
  if (min < 60) return min + ' min';
  const horas = Math.floor(min / 60), resto = min % 60;
  if (horas < 24) return horas + ' h' + (resto ? ' ' + resto + ' min' : '');
  const dias = Math.floor(horas / 24), hs = horas % 24;
  return dias + ' d' + (hs ? ' ' + hs + ' h' : '');
}

function tile(label, valor, pie, alerta) {
  return `<div class="met-tile">
    <div class="met-label">${label}</div>
    <div class="met-valor">${valor}</div>
    ${pie ? `<div class="met-pie${alerta ? ' alerta' : ''}">${pie}</div>` : ''}
  </div>`;
}

async function cargarMetricas() {
  const cont = $('met-contenido');
  // Botones de período
  $('met-periodo').innerHTML = [[7, 'Últimos 7 días'], [30, 'Últimos 30 días'], [90, 'Últimos 90 días'], [0, 'Desde siempre']]
    .map(([d, t]) => `<button class="client-chip ${metPeriodo === d ? 'active' : ''}" onclick="metSetPeriodo(${d})">${t}</button>`).join('');
  // Lista de clientes (la misma que ya tenemos cargada)
  const sel = $('met-cliente');
  const elegido = sel.value || 'Todos';
  const nombres = [...new Set(allConsultas.filter(c => c.direccion === 'cliente_a_planet').map(c => c.cliente))].sort();
  sel.innerHTML = `<option value="Todos">Todos los clientes</option>` +
    nombres.map(n => `<option value="${esc(n)}"${elegido === n ? ' selected' : ''}>${esc(n)}</option>`).join('');

  cont.innerHTML = '<div class="spinner"></div>';
  const res = await api({ action: 'metricas', dias: metPeriodo, cliente: sel.value || 'Todos' });
  if (!res.ok) { cont.innerHTML = `<div class="empty-state"><p>Error: ${esc(res.error || 'no se pudo calcular')}</p></div>`; return; }
  cont.innerHTML = pintarMetricas(res);
  entrada(cont.querySelectorAll('.met-tile, .met-panel'), 'translateY(8px)', 30);
}

function metSetPeriodo(d) { metPeriodo = d; cargarMetricas(); }

function pintarMetricas(m) {
  const r = m.resolucion, pr = m.primeraRespuesta, rc = m.respuestaCliente, ab = m.abiertas;
  const periodoTexto = m.dias ? `últimos ${m.dias} días` : 'todo el historial';

  const tiles = [
    tile('Consultas nuevas', m.nuevas, periodoTexto),
    tile('Resueltas', m.resueltas, r.aproximadas ? `${r.aproximadas} con cierre estimado` : periodoTexto),
    tile('Tiempo de resolución', fmtDuracion(r.mediana), r.muestras ? `promedio ${fmtDuracion(r.promedio)} · ${r.muestras} consultas` : 'sin datos todavía'),
    tile('Nuestra 1ª respuesta', fmtDuracion(pr.mediana), pr.sinResponder ? `${pr.sinResponder} sin responder` : (pr.muestras ? `promedio ${fmtDuracion(pr.promedio)} · ${pr.muestras} consultas` : 'sin datos todavía'), !!pr.sinResponder),
    tile('Respuesta del cliente', fmtDuracion(rc.mediana), rc.muestras ? `promedio ${fmtDuracion(rc.promedio)} · ${rc.muestras} respuestas` : 'sin datos todavía'),
    tile('Abiertas ahora', ab.cantidad, ab.cantidad ? `la más vieja: ${fmtDuracion(ab.antiguedadMaxima)}${ab.masDe48h ? ` · ${ab.masDe48h} de más de 48 h` : ''}` : 'ninguna pendiente', ab.masDe48h > 0),
  ].join('');

  // Tipos de consulta: una sola serie, un solo color, con el número al lado
  const maxTipo = m.tipos.length ? m.tipos[0].cantidad : 0;
  const totalTipos = m.tipos.reduce((a, t) => a + t.cantidad, 0);
  const tipos = m.tipos.length
    ? m.tipos.map(t => {
        const pct = totalTipos ? Math.round(t.cantidad * 100 / totalTipos) : 0;
        return `<div class="barra-fila" title="${esc(t.tipo)}: ${t.cantidad} consultas (${pct}%)">
          <div class="barra-nombre">${esc(t.tipo)}</div>
          <div class="barra-pista"><div class="barra-valor-fill" style="width:${maxTipo ? Math.max(2, t.cantidad * 100 / maxTipo) : 0}%"></div></div>
          <div class="barra-cifra">${t.cantidad} <span>(${pct}%)</span></div>
        </div>`;
      }).join('')
    : '<p class="met-nota">Todavía no hay consultas en este período.</p>';

  const filas = m.clientes.length
    ? m.clientes.map(c => `<tr>
        <td>${esc(c.cliente)}</td>
        <td class="num">${c.nuevas}</td>
        <td class="num">${c.resueltas}</td>
        <td class="num">${fmtDuracion(c.resolucion)}</td>
      </tr>`).join('')
    : '<tr><td colspan="4" style="color:var(--text-muted)">Sin datos en este período</td></tr>';

  return `
    <div class="met-grid">${tiles}</div>

    <div class="met-panel">
      <h4>Qué nos consultan (${totalTipos} consulta${totalTipos === 1 ? '' : 's'})</h4>
      ${tipos}
    </div>

    <div class="met-panel">
      <h4>Por cliente</h4>
      <table class="met-tabla">
        <thead><tr><th>Cliente</th><th style="text-align:right">Nuevas</th><th style="text-align:right">Resueltas</th><th style="text-align:right">Resolución</th></tr></thead>
        <tbody>${filas}</tbody>
      </table>
    </div>

    <p class="met-nota">
      Los tiempos son en <strong>horas corridas</strong>: el reloj corre también de noche y los fines de semana.
      Se muestra la <strong>mediana</strong> (el caso del medio), que no se deforma con un caso extremo; el promedio va abajo.
      “Resuelta” es una consulta cerrada.
      ${m.resolucion.aproximadas ? `<br>${m.resolucion.aproximadas} consultas cerradas antes de que empezáramos a medir tienen fecha de cierre estimada y no entran en el tiempo de resolución.` : ''}
    </p>`;
}

// ═══ POST-ITS DE PLANET ═══
// Cada usuario de Planet pega sus notas donde quiera sobre la pantalla y las arrastra (son personales).
// Con el pin quedan fijas en la pantalla y te siguen al bajar; sin pin quedan pegadas en ese lugar de la página.
// Se guardan en la hoja PortalNotas con su posición: x = fracción del ancho, y = píxeles desde arriba.
const NOTA_COLORES = ['amarillo', 'rosa', 'verde', 'celeste', 'violeta'];
const NOTA_ANCHO = 210;
const PIN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 01-1.11 1.79l-1.78.9A2 2 0 005 15.24V16a1 1 0 001 1h12a1 1 0 001-1v-.76a2 2 0 00-1.11-1.79l-1.78-.9A2 2 0 0115 10.76V7a1 1 0 011-1 2 2 0 000-4H8a2 2 0 000 4 1 1 0 011 1z"/></svg>';
const CRUZ_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const ACHICAR_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg>';
const AGRANDAR_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>';
const GRIP_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';
let notasData = [];
let _notaTmp = 0;
let _repintarNotas = false;
let _arrastrando = false;
let _zNota = 1;

function notasKey() { return 'planet_notas_' + (currentUser ? currentUser.usuario : ''); }
function notaPorId(id) { return notasData.find(n => String(n.id) === String(id)); }
function notaDe(el) { const c = el && el.closest('[data-id]'); return c ? notaPorId(c.dataset.id) : null; }
function elNota(n) { return n ? document.querySelector(`#notas-capa .postit[data-id="${n.id}"]`) : null; }
function capaNotas() { return $('notas-capa'); }
// Posición de la nota en la ventana, calculada con su lugar guardado (sin la inclinación ni animaciones)
function posEnVentana(el, n) {
  const o = origenCapa(), l = parseFloat(el.style.left) || 0, t = parseFloat(el.style.top) || 0;
  return n.pin ? { left: l, top: t } : { left: l + o.left - window.scrollX, top: t + o.top - window.scrollY };
}
function origenCapa() { const r = capaNotas().getBoundingClientRect(); return { left: r.left + window.scrollX, top: r.top + window.scrollY }; }

// Junta lo que llega del servidor con lo local: una nota que se está editando o guardando no se pisa
function setNotas(lista) {
  if (!Array.isArray(lista)) return;
  const locales = new Map(notasData.map(n => [String(n.id), n]));
  const nuevas = lista.map(n => {
    const l = locales.get(String(n.id));
    if (!l) return n;
    if (l._borrada) return null;
    if (l._sucio || l._guardando || l._creando) return l;
    return Object.assign(l, n);
  }).filter(Boolean);
  notasData.filter(n => String(n.id).indexOf('tmp') === 0).forEach(n => nuevas.push(n));
  notasData = nuevas;
  try { localStorage.setItem(notasKey(), JSON.stringify(lista)); } catch (e) {}
  pintarNotas();
}

function htmlNota(n) {
  const h = String(n.id).split('').reduce((a, c) => a + c.charCodeAt(0), 0);
  const rot = ((h % 5) - 2) * 0.6;
  const colores = NOTA_COLORES.map(c =>
    `<button class="nota-color nota-${c}${n.color === c ? ' on' : ''}" onclick="notaColor(this,'${c}')" title="Color ${c}" aria-label="Color ${c}"></button>`).join('');
  const resumen = String(n.texto || '').trim().split('\n')[0];
  return `
    <div class="postit nota-${n.color || 'amarillo'}${n.pin ? ' fija' : ''}${n.min ? ' min' : ''}" data-id="${esc(String(n.id))}" style="--rot:${rot}deg" onpointerdown="traerAlFrente(this)">
      <div class="postit-barra" onpointerdown="arrastrarNota(event)" title="Arrastrá para mover la nota">
        <span class="postit-grip">${GRIP_ICON}</span>
        <button class="nota-btn nota-pin${n.pin ? ' on' : ''}" onclick="notaPin(this)" aria-pressed="${n.pin ? 'true' : 'false'}"
          title="${n.pin ? 'Quitar el pin (vuelve a quedar pegada en la página)' : 'Fijar en la pantalla (te sigue al bajar)'}">${PIN_ICON}</button>
        <button class="nota-btn" onclick="notaMin(this)" title="${n.min ? 'Agrandar' : 'Achicar'}">${n.min ? AGRANDAR_ICON : ACHICAR_ICON}</button>
        <button class="nota-btn" onclick="notaBorrar(this)" title="Borrar nota">${CRUZ_ICON}</button>
      </div>
      <textarea class="postit-texto" placeholder="Escribí tu nota..." aria-label="Texto de la nota" oninput="notaEscribir(this)" onblur="notaGuardarYa(this)">${esc(n.texto || '')}</textarea>
      <div class="postit-resumen" onclick="notaMin(this)" title="Tocá para agrandar">${resumen ? esc(resumen) : '<i style="opacity:.6">(nota vacía)</i>'}</div>
      <div class="postit-pie">
        <div class="nota-colores">${colores}</div>
        <span class="nota-estado"></span>
      </div>
    </div>`;
}

// Coloca la nota en su lugar, sin dejar que quede fuera de la pantalla
function ubicarNota(el, n) {
  const capa = capaNotas();
  if (!el || !n || !capa || !capa.offsetWidth) return;
  const W = n.pin ? window.innerWidth : capa.offsetWidth;
  const w = el.offsetWidth || NOTA_ANCHO;
  const x = n.x == null || isNaN(n.x) ? 0.72 : Number(n.x);
  const y = n.y == null || isNaN(n.y) ? 110 : Number(n.y);
  el.style.left = Math.min(Math.max(8, x * W), Math.max(8, W - w - 8)) + 'px';
  el.style.top = (n.pin ? Math.min(Math.max(8, y), window.innerHeight - 48) : Math.max(8, y)) + 'px';
}

function pintarNotas() {
  const capa = capaNotas();
  if (!capa) return;
  // No se repinta mientras se arrastra o se escribe (se perdería el foco); se repinta después
  const escribiendo = capa.contains(document.activeElement) && document.activeElement.tagName === 'TEXTAREA';
  if (_arrastrando || escribiendo || !capa.offsetWidth) { _repintarNotas = true; return; }
  _repintarNotas = false;
  capa.innerHTML = notasData.filter(n => !n._borrada).map(htmlNota).join('');
  capa.querySelectorAll('.postit').forEach(el => ubicarNota(el, notaDe(el)));
}
document.addEventListener('focusout', e => {
  const capa = capaNotas();
  if (!_repintarNotas || !capa || !capa.contains(e.target)) return;
  setTimeout(() => { if (!capa.contains(document.activeElement)) pintarNotas(); }, 0);
});
window.addEventListener('resize', () => {
  document.querySelectorAll('#notas-capa .postit').forEach(el => ubicarNota(el, notaDe(el)));
});

function traerAlFrente(el) { if (el) el.style.zIndex = ++_zNota; }

// Arrastrar desde la barra de arriba (mouse o dedo)
function arrastrarNota(e) {
  if (e.target.closest('button')) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const el = e.currentTarget.closest('.postit'), n = notaDe(el);
  if (!n) return;
  e.preventDefault();
  traerAlFrente(el);
  const r = posEnVentana(el, n), dx = e.clientX - r.left, dy = e.clientY - r.top;
  const o = origenCapa();
  let movio = false;
  _arrastrando = true;
  el.classList.add('arrastrando');
  const mover = ev => {
    movio = true;
    const left = Math.min(Math.max(0, ev.clientX - dx), window.innerWidth - el.offsetWidth);
    const top = Math.min(Math.max(0, ev.clientY - dy), window.innerHeight - 40);
    if (n.pin) { el.style.left = left + 'px'; el.style.top = top + 'px'; }
    else { el.style.left = (left + window.scrollX - o.left) + 'px'; el.style.top = (top + window.scrollY - o.top) + 'px'; }
  };
  const soltar = () => {
    window.removeEventListener('pointermove', mover);
    window.removeEventListener('pointerup', soltar);
    window.removeEventListener('pointercancel', soltar);
    el.classList.remove('arrastrando');
    _arrastrando = false;
    if (movio) {
      const W = n.pin ? window.innerWidth : capaNotas().offsetWidth;
      n.x = parseFloat(el.style.left) / W;
      n.y = parseFloat(el.style.top);
      guardarNota(n, { x: n.x.toFixed(4), y: Math.round(n.y) });
    }
    if (_repintarNotas) pintarNotas();
  };
  window.addEventListener('pointermove', mover);
  window.addEventListener('pointerup', soltar);
  window.addEventListener('pointercancel', soltar);
}

function estadoNota(n, texto) {
  const el = elNota(n);
  const e = el && el.querySelector('.nota-estado');
  if (!e) return;
  e.textContent = texto;
  clearTimeout(e._t);
  if (texto === 'Guardado ✓') e._t = setTimeout(() => { e.textContent = ''; }, 1800);
}

async function guardarNota(n, campos) {
  if (n._creando) await n._creando;
  if (n._borrada || String(n.id).indexOf('tmp') === 0) return;
  n._guardando = (n._guardando || 0) + 1;
  if ('texto' in campos) estadoNota(n, 'Guardando…');
  const res = await api(Object.assign({ action: 'nota_guardar', id: n.id }, campos));
  n._guardando--;
  if (res.ok) {
    if ('texto' in campos) estadoNota(n, n._sucio ? 'Sin guardar…' : 'Guardado ✓');
  } else {
    if ('texto' in campos) { n._sucio = true; estadoNota(n, 'No se guardó'); }
    toast('No se pudo guardar la nota: ' + (res.error || 'error'));
  }
}

async function nuevaNota() {
  const capa = capaNotas();
  if (!capa || !capa.offsetWidth) return;
  const k = notasData.filter(n => !n._borrada).length % 5;
  const o = origenCapa();
  const n = {
    id: 'tmp' + (++_notaTmp), texto: '', color: NOTA_COLORES[k], pin: false, min: false,
    x: Math.max(0, window.innerWidth - NOTA_ANCHO - 40 - k * 22) / capa.offsetWidth,
    y: window.scrollY - o.top + 90 + k * 26
  };
  notasData.push(n);
  capa.insertAdjacentHTML('beforeend', htmlNota(n));
  const el = elNota(n);
  ubicarNota(el, n);
  traerAlFrente(el);
  anim(el, { transform: ['scale(0.5) rotate(-8deg)', 'scale(1) rotate(' + el.style.getPropertyValue('--rot') + ')'], opacity: [0, 1] },
    { resorte: [300, 17], mantener: false });
  el.querySelector('.postit-texto').focus({ preventScroll: true });
  n._creando = api({ action: 'nota_guardar', texto: '', color: n.color, x: n.x.toFixed(4), y: Math.round(n.y) }).then(res => {
    if (!res.ok) {
      n._borrada = true;
      notasData = notasData.filter(x => x !== n);
      const e = elNota(n); if (e) e.remove();
      toast('No se pudo crear la nota: ' + (res.error || 'error'));
      return;
    }
    const e = elNota(n);
    n.id = res.id;
    if (e) e.dataset.id = String(res.id);
    // Si mientras tanto llegó la misma nota desde el servidor, queda una sola
    notasData = notasData.filter(x => x === n || String(x.id) !== String(n.id));
  });
  await n._creando;
  n._creando = null;
  if (n._borrada) {
    if (String(n.id).indexOf('tmp') !== 0) api({ action: 'nota_borrar', id: n.id });
    return;
  }
  if (n._sucio) notaGuardarYa(elNota(n));
}

function notaEscribir(ta) {
  const n = notaDe(ta);
  if (!n) return;
  n.texto = ta.value;
  n._sucio = true;
  estadoNota(n, 'Sin guardar…');
  clearTimeout(n._timer);
  n._timer = setTimeout(() => notaGuardarYa(ta), 900);
}
function notaGuardarYa(el) {
  const n = notaDe(el);
  if (!n || !n._sucio || n._creando) return;
  clearTimeout(n._timer);
  n._sucio = false;
  guardarNota(n, { texto: n.texto });
  // Actualiza el resumen que se ve cuando la nota está achicada
  const e = elNota(n), linea = String(n.texto || '').trim().split('\n')[0];
  const r = e && e.querySelector('.postit-resumen');
  if (r) r.innerHTML = linea ? esc(linea) : '<i style="opacity:.6">(nota vacía)</i>';
}

// Pin: fija la nota en la pantalla (te sigue al bajar) o la vuelve a pegar en la página, sin que salte de lugar
function notaPin(btn) {
  const n = notaDe(btn), el = elNota(n);
  if (!n || !el) return;
  const r = posEnVentana(el, n), o = origenCapa();
  n.pin = !n.pin;
  if (n.pin) { n.x = r.left / window.innerWidth; n.y = r.top; }
  else { n.x = (r.left + window.scrollX - o.left) / capaNotas().offsetWidth; n.y = r.top + window.scrollY - o.top; }
  el.classList.toggle('fija', n.pin);
  btn.classList.toggle('on', n.pin);
  btn.setAttribute('aria-pressed', n.pin ? 'true' : 'false');
  btn.title = n.pin ? 'Quitar el pin (vuelve a quedar pegada en la página)' : 'Fijar en la pantalla (te sigue al bajar)';
  ubicarNota(el, n);
  anim(btn, { transform: ['scale(0.5) rotate(-30deg)', 'none'] }, { resorte: [420, 14], mantener: false });
  toast(n.pin ? '📎 Nota fijada: te sigue al bajar' : '📎 Nota pegada en la página');
  guardarNota(n, { pin: n.pin ? '1' : '0', x: n.x.toFixed(4), y: Math.round(n.y) });
}

function notaMin(btn) {
  const n = notaDe(btn), el = elNota(n);
  if (!n || !el) return;
  n.min = !n.min;
  const h0 = el.offsetHeight, w0 = el.offsetWidth;
  el.classList.toggle('min', n.min);
  const b = el.querySelector('.postit-barra .nota-btn:nth-of-type(2)');
  if (b) { b.innerHTML = n.min ? AGRANDAR_ICON : ACHICAR_ICON; b.title = n.min ? 'Agrandar' : 'Achicar'; }
  anim(el, { height: [h0 + 'px', el.offsetHeight + 'px'], width: [w0 + 'px', el.offsetWidth + 'px'] }, { resorte: [300, 24], mantener: false });
  ubicarNota(el, n);
  if (!n.min) el.querySelector('.postit-texto').focus({ preventScroll: true });
  guardarNota(n, { min: n.min ? '1' : '0' });
}

function notaColor(btn, color) {
  const n = notaDe(btn), el = elNota(n);
  if (!n || n.color === color) return;
  n.color = color;
  if (el) {
    NOTA_COLORES.forEach(c => el.classList.toggle('nota-' + c, c === color));
    el.querySelectorAll('.nota-color').forEach(b => b.classList.toggle('on', b.classList.contains('nota-' + color)));
  }
  guardarNota(n, { color });
}

async function notaBorrar(btn) {
  const n = notaDe(btn);
  if (!n) return;
  if (String(n.texto || '').trim() && !confirm('¿Borrar esta nota?')) return;
  n._borrada = true;
  clearTimeout(n._timer);
  const el = elNota(n);
  if (el) {
    await anim(el, { transform: ['none', 'scale(0.5) rotate(10deg)'], opacity: [1, 0] }, { duracion: 220, mantener: false, fill: 'forwards' });
    el.remove();
  }
  notasData = notasData.filter(x => x !== n);
  if (n._creando) return;  // se borra en el servidor cuando termine de crearse
  const res = await api({ action: 'nota_borrar', id: n.id });
  if (!res.ok) toast('No se pudo borrar la nota: ' + (res.error || 'error'));
}

// ═══ GUÍA PARA CLIENTES NUEVOS ═══
// Se muestra sola la primera vez que el cliente entra (en ese dispositivo). El botón "?" la repite.
const GUIA_CLIENTE = [
  { titulo: '¡Hola! 👋', texto: 'Te mostramos en un minuto cómo funciona el Portal de Clientes de Planet.' },
  { el: () => document.querySelector('#screen-client .subtab-bar'), titulo: 'Tus consultas y las de Planet',
    texto: '“Mis consultas” son las que le enviás vos a Planet. “De Planet” son las que Planet te hace a vos sobre algún envío.' },
  { el: () => $('client-stats'), titulo: 'Resumen',
    texto: 'De un vistazo: cuántas consultas tenés pendientes, en proceso, esperando tu respuesta y cerradas.' },
  { el: () => document.querySelector('#screen-client .client-sub.active .estado-chips'), titulo: 'Solapas por estado',
    texto: 'Tocá una solapa para ver solo esas consultas. Las cerradas quedan guardadas en la suya.' },
  { el: () => document.querySelector('#screen-client .client-sub.active .consulta-card'), titulo: 'Abrí una consulta',
    texto: 'Tocala para ver la conversación y responder. Con el clip podés adjuntar fotos (o pegarlas con Ctrl + V).' },
  { el: () => document.querySelector('#screen-client .fab'), titulo: 'Consulta nueva',
    texto: 'Con este botón le mandás una consulta nueva a Planet: número de tracking, tipo de problema y tu mensaje.' },
  { el: () => $('client-reload'), titulo: 'Actualizar', texto: 'Tocá acá para ver si llegaron respuestas nuevas.' },
  { el: () => $('client-guia-btn'), titulo: '¡Listo!',
    texto: 'Cuando Planet necesite info tuya vas a ver un aviso celeste y la consulta en “Esperan tu respuesta”. Si querés ver esta guía de nuevo, tocá este botón.' }
];
let _guia = null;

function guiaKey() { return 'planet_guia_' + (currentUser ? currentUser.usuario : ''); }
function guiaVista() { try { return localStorage.getItem(guiaKey()) === '1'; } catch (e) { return true; } }
function visible(el) { return !!(el && el.getClientRects().length && el.offsetWidth); }

function iniciarGuia() {
  if (_guia || !currentUser) return;
  const pasos = GUIA_CLIENTE.filter(p => !p.el || visible(p.el()));
  const root = document.createElement('div');
  root.className = 'guia';
  root.setAttribute('role', 'dialog');
  root.setAttribute('aria-modal', 'true');
  root.setAttribute('aria-label', 'Guía del portal');
  root.innerHTML = '<div class="guia-foco sin-objetivo"></div><div class="guia-card" aria-live="polite"></div>';
  document.body.appendChild(root);
  _guia = { root, pasos, i: 0 };
  anim(root, { opacity: [0, 1] }, { duracion: 250, mantener: false });
  root.addEventListener('keydown', guiaTeclas);
  window.addEventListener('resize', ubicarGuia);
  pasoGuia(0);
}
function guiaTeclas(e) {
  if (e.key === 'Escape') cerrarGuia();
  else if (e.key === 'ArrowRight') pasoGuia(_guia.i + 1);
  else if (e.key === 'ArrowLeft' && _guia.i > 0) pasoGuia(_guia.i - 1);
}
function pasoGuia(i) {
  const g = _guia;
  if (!g) return;
  if (i >= g.pasos.length) return cerrarGuia();
  const adelante = i >= g.i;
  g.i = i;
  const p = g.pasos[i], ultimo = i === g.pasos.length - 1;
  const obj = p.el && p.el();
  if (obj) obj.scrollIntoView({ block: 'center', behavior: 'auto' });
  const card = g.root.querySelector('.guia-card');
  card.innerHTML = `
    <div class="guia-paso">Paso ${i + 1} de ${g.pasos.length}</div>
    <h3>${p.titulo}</h3>
    <p>${p.texto}</p>
    <div class="guia-puntos">${g.pasos.map((_, k) => `<span class="${k === i ? 'on' : ''}"></span>`).join('')}</div>
    <div class="guia-botones">
      ${ultimo ? '<span style="margin-right:auto"></span>' : '<button class="guia-saltar" onclick="cerrarGuia()">Saltar guía</button>'}
      ${i > 0 ? `<button class="guia-atras" onclick="pasoGuia(${i - 1})">Atrás</button>` : ''}
      <button class="guia-sig" onclick="pasoGuia(${i + 1})">${ultimo ? 'Empezar' : i === 0 ? 'Mostrame' : 'Siguiente'}</button>
    </div>`;
  ubicarGuia();
  anim(card, { opacity: [0, 1], transform: [`translateX(${adelante ? 16 : -16}px)`, 'none'] }, { resorte: [300, 26], mantener: false });
  card.querySelector('.guia-sig').focus({ preventScroll: true });
}
function ubicarGuia() {
  const g = _guia;
  if (!g) return;
  const p = g.pasos[g.i], obj = p.el && p.el();
  const foco = g.root.querySelector('.guia-foco'), card = g.root.querySelector('.guia-card');
  const vw = window.innerWidth, vh = window.innerHeight, cw = card.offsetWidth, ch = card.offsetHeight;
  if (!visible(obj)) {
    foco.classList.add('sin-objetivo');
    Object.assign(foco.style, { left: vw / 2 + 'px', top: vh / 2 + 'px', width: '0px', height: '0px' });
    Object.assign(card.style, { left: (vw - cw) / 2 + 'px', top: Math.max(16, (vh - ch) / 2) + 'px' });
    return;
  }
  const r = obj.getBoundingClientRect(), pad = 6;
  foco.classList.remove('sin-objetivo');
  Object.assign(foco.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px' });
  let top = r.bottom + pad + 14;
  if (top + ch > vh - 16) top = r.top - pad - 14 - ch;
  if (top < 16) top = Math.max(16, vh - ch - 16);
  const left = Math.min(Math.max(16, r.left + r.width / 2 - cw / 2), vw - cw - 16);
  Object.assign(card.style, { left: left + 'px', top: top + 'px' });
}
function cerrarGuia() {
  const g = _guia;
  if (!g) return;
  _guia = null;
  try { localStorage.setItem(guiaKey(), '1'); } catch (e) {}
  window.removeEventListener('resize', ubicarGuia);
  anim(g.root, { opacity: [1, 0] }, { duracion: 200, mantener: false, fill: 'forwards' }).then(() => g.root.remove());
}

// ═══ ADMIN: USER MANAGEMENT ═══
function toggleNewUserForm() {
  const f = $('new-user-form');
  f.style.display = f.style.display === 'none' ? '' : 'none';
}

function toggleClienteField() {
  $('nu-empresa-wrap').style.display = $('nu-team').value === 'cliente' ? '' : 'none';
}

let editingUser = null;

async function loadUsers() {
  $('users-list').innerHTML = esqueletoHtml(3);
  const res = await api({ action: 'usuarios' });
  let users = [];
  if (res.ok) {
    users = res.usuarios;
  } else {
    $('users-list').innerHTML = '<div class="empty-state"><p>Error cargando usuarios</p></div>'; return;
  }
  if (users.length === 0) {
    $('users-list').innerHTML = '<div class="empty-state"><p>No hay usuarios</p></div>';
    return;
  }
  const teamLabel = t => t === 'planet' ? '<span style="background:#3b82f6;color:#fff;padding:2px 8px;border-radius:6px;font-size:12px;">Planet</span>' : '<span style="background:#10b981;color:#fff;padding:2px 8px;border-radius:6px;font-size:12px;">Cliente</span>';
  const roleLabel = r => r === 'admin' ? '<span style="background:#f59e0b;color:#000;padding:2px 8px;border-radius:6px;font-size:12px;">Admin</span>' : '';
  let html = '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:14px;">';
  html += '<thead><tr style="border-bottom:2px solid var(--border);text-align:left;">';
  html += '<th style="padding:10px 8px;">Usuario</th><th style="padding:10px 8px;">Nombre</th><th style="padding:10px 8px;">Equipo</th><th style="padding:10px 8px;">Empresa</th><th style="padding:10px 8px;">Rol</th><th style="padding:10px 8px;text-align:right;">Acciones</th>';
  html += '</tr></thead><tbody>';
  users.forEach(u => {
    const uEsc = esc(u.usuario).replace(/'/g,"\\'");
    if (editingUser === u.usuario) {
      html += `<tr id="edit-row-${esc(u.usuario)}" style="border-bottom:1px solid var(--border);background:var(--hover);">`;
      html += `<td style="padding:8px;font-weight:500;">${esc(u.usuario)}</td>`;
      html += `<td style="padding:8px;"><input type="text" id="eu-nombre" value="${esc(u.nombre)}" style="width:100%;padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text-primary);font-size:13px;"></td>`;
      html += `<td style="padding:8px;"><select id="eu-team" style="padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text-primary);font-size:13px;" onchange="document.getElementById('eu-cliente-wrap').style.display=this.value==='cliente'?'':'none'">`;
      html += `<option value="planet"${u.team==='planet'?' selected':''}>Planet</option><option value="cliente"${u.team==='cliente'?' selected':''}>Cliente</option></select></td>`;
      html += `<td style="padding:8px;"><span id="eu-cliente-wrap" style="${u.team==='cliente'?'':'display:none'}"><select id="eu-cliente" style="padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text-primary);font-size:13px;">`;
      allClientesData.forEach(c => { html += `<option value="${esc(c.nombre)}"${c.nombre===u.cliente?' selected':''}>${esc(c.nombre)}</option>`; });
      html += `</select></span><span id="eu-planet-dash" style="${u.team==='planet'?'':'display:none'}">-</span></td>`;
      html += `<td style="padding:8px;"><select id="eu-role" style="padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text-primary);font-size:13px;">`;
      html += `<option value="user"${u.role==='user'?' selected':''}>Usuario</option><option value="admin"${u.role==='admin'?' selected':''}>Admin</option></select></td>`;
      html += `<td style="padding:8px;text-align:right;white-space:nowrap;">`;
      html += `<input type="text" id="eu-pass" placeholder="Nueva contraseña (dejar vacío = no cambiar)" style="width:140px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text-primary);font-size:12px;margin-right:6px;">`;
      html += `<button onclick="saveUserEdit('${uEsc}')" style="padding:4px 10px;border-radius:6px;border:1px solid #3b82f6;background:#3b82f6;color:#fff;font-size:12px;cursor:pointer;margin-right:4px;">Guardar</button>`;
      html += `<button onclick="cancelUserEdit()" style="padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text-secondary);font-size:12px;cursor:pointer;">Cancelar</button>`;
      html += '</td></tr>';
    } else {
      html += '<tr style="border-bottom:1px solid var(--border);">';
      html += `<td style="padding:10px 8px;font-weight:500;">${esc(u.usuario)}</td>`;
      html += `<td style="padding:10px 8px;">${esc(u.nombre)}</td>`;
      html += `<td style="padding:10px 8px;">${teamLabel(u.team)}</td>`;
      html += `<td style="padding:10px 8px;">${esc(u.cliente || '-')}</td>`;
      html += `<td style="padding:10px 8px;">${roleLabel(u.role)}</td>`;
      html += `<td style="padding:10px 8px;text-align:right;white-space:nowrap;">`;
      html += `<button onclick="startEditUser('${uEsc}')" style="padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text-primary);font-size:12px;cursor:pointer;margin-right:4px;" title="Editar">✏️ Editar</button>`;
      html += `<button onclick="deleteUser('${uEsc}','${esc(u.nombre).replace(/'/g,"\\'")}')" style="padding:4px 10px;border-radius:6px;border:1px solid var(--danger);background:var(--danger-bg);color:var(--danger-text);font-size:12px;cursor:pointer;" title="Eliminar">Eliminar</button>`;
      html += '</td></tr>';
    }
  });
  html += '</tbody></table></div>';
  $('users-list').innerHTML = html;
}

function startEditUser(usuario) {
  editingUser = usuario;
  loadUsers();
}

function cancelUserEdit() {
  editingUser = null;
  loadUsers();
}

async function saveUserEdit(usuario) {
  const params = { action: 'editar_usuario', usuario };
  const nombre = $('eu-nombre').value.trim();
  const team = $('eu-team').value;
  const cliente = team === 'cliente' ? $('eu-cliente').value : '-';
  const role = $('eu-role').value;
  const pass = $('eu-pass').value.trim();
  if (nombre) params.nombre = nombre;
  params.team = team;
  params.cliente = cliente;
  params.role = role;
  if (pass) params.password = pass;
  const res = await api(params);
  if (res.ok) {
    toast('Usuario actualizado');
    editingUser = null;
    loadUsers();
  } else {
    toast('Error: ' + (res.error || 'No se pudo actualizar'));
  }
}

async function deleteUser(usuario, nombre) {
  if (usuario === currentUser.usuario) { toast('No podés eliminar tu propio usuario'); return; }
  if (!confirm('¿Eliminar el usuario "' + nombre + '" (' + usuario + ')? Esta acción no se puede deshacer.')) return;
  const res = await api({ action: 'eliminar_usuario', usuario });
  if (res.ok) {
    toast('Usuario eliminado');
    loadUsers();
  } else {
    toast('Error: ' + (res.error || 'No se pudo eliminar'));
  }
}

async function createUser() {
  const usuario = $('nu-user').value.trim();
  const nombre = $('nu-name').value.trim();
  const password = $('nu-pass').value.trim();
  const team = $('nu-team').value;
  const empresa = team === 'cliente' ? $('nu-empresa').value : '-';
  const role = $('nu-role').value;

  if (!usuario || !nombre || !password) { toast('Completá usuario, nombre y contraseña'); return; }
  if (team === 'cliente' && !empresa) { toast('Ingresá el nombre de la empresa'); return; }

  const res = await api({
    action: 'crear_usuario',
    usuario, password, nombre, team, cliente: empresa, role
  });

  if (res.ok) {
    toast('Usuario creado');
    $('nu-user').value = '';
    $('nu-name').value = '';
    $('nu-pass').value = '';
    $('nu-empresa').value = '';
    toggleNewUserForm();
    loadUsers();
  } else {
    toast('Error: ' + (res.error || 'No se pudo crear'));
  }
}

// ═══ ADMIN: CLIENT MANAGEMENT ═══
let allClientesData = [];

function toggleNewClientForm() {
  const f = $('new-client-form');
  f.style.display = f.style.display === 'none' ? '' : 'none';
}

async function loadClients() {
  $('clients-list').innerHTML = esqueletoHtml(3);
  const res = await api({ action: 'clientes' });
  if (!res.ok) {
    $('clients-list').innerHTML = '<div class="empty-state"><p>Error cargando clientes</p></div>';
    return;
  }
  allClientesData = res.clientes || [];
  if (allClientesData.length === 0) {
    $('clients-list').innerHTML = '<div class="empty-state"><p>No hay clientes registrados</p></div>';
    return;
  }
  let html = '<div style="display:grid;gap:12px;">';
  allClientesData.forEach(c => {
    html += `<div style="background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:16px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;">
        <div>
          <div style="font-weight:600;font-size:16px;">${esc(c.nombre)}</div>
          <div style="font-size:13px;color:var(--text-muted);margin-top:2px;">Alta: ${esc(c.fecha_alta || '-')}</div>
        </div>
        <button onclick="deleteClient(${c.id},'${esc(c.nombre).replace(/'/g,"\\'")}')" style="padding:6px 12px;border-radius:6px;border:1px solid var(--danger);background:var(--danger-bg);color:var(--danger-text);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);white-space:nowrap;" title="Eliminar cliente">Eliminar</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:12px;font-size:13px;">
        <div><span style="color:var(--text-muted);">Contacto:</span> ${esc(c.contacto || '-')}</div>
        <div><span style="color:var(--text-muted);">Teléfono:</span> ${esc(c.telefono || '-')}</div>
        <div><span style="color:var(--text-muted);">Email:</span> ${esc(c.email || '-')}</div>
        <div><span style="color:var(--text-muted);">Dirección:</span> ${esc(c.direccion || '-')}</div>
      </div>
      ${c.notas ? `<div style="font-size:13px;color:var(--text-secondary);margin-top:8px;padding-top:8px;border-top:1px solid var(--card-border);">${esc(c.notas)}</div>` : ''}
    </div>`;
  });
  html += '</div>';
  $('clients-list').innerHTML = html;
  // Also populate the user form empresa dropdown
  populateEmpresaDropdown();
}

function populateEmpresaDropdown() {
  const sel = $('nu-empresa');
  if (!sel) return;
  let opts = '<option value="">-- Seleccionar --</option>';
  allClientesData.forEach(c => {
    opts += `<option value="${esc(c.nombre)}">${esc(c.nombre)}</option>`;
  });
  sel.innerHTML = opts;
}

async function createClient() {
  const nombre = $('nc-nombre').value.trim();
  if (!nombre) { toast('Ingresá el nombre de la empresa'); return; }
  const res = await api({
    action: 'crear_cliente',
    nombre,
    contacto: $('nc-contacto').value.trim(),
    telefono: $('nc-telefono').value.trim(),
    email: $('nc-email').value.trim(),
    direccion: $('nc-direccion').value.trim(),
    notas: $('nc-notas').value.trim()
  });
  if (res.ok) {
    toast('Cliente creado');
    ['nc-nombre','nc-contacto','nc-telefono','nc-email','nc-direccion','nc-notas'].forEach(id => $(id).value = '');
    toggleNewClientForm();
    loadClients();
  } else {
    toast('Error: ' + (res.error || 'No se pudo crear'));
  }
}

async function deleteClient(id, nombre) {
  if (!confirm('¿Eliminar el cliente "' + nombre + '"? Esta acción no se puede deshacer.')) return;
  const res = await api({ action: 'eliminar_cliente', id });
  if (res.ok) {
    toast('Cliente eliminado');
    loadClients();
  } else {
    toast('Error: ' + (res.error || 'No se pudo eliminar'));
  }
}

// Load clients on init for empresa dropdown
async function preloadClients() {
  try {
    const res = await api({ action: 'clientes' });
    if (res.ok) { allClientesData = res.clientes || []; populateEmpresaDropdown(); }
  } catch(e) {}
}
